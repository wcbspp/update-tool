<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc45c"/>
      <stop offset="1" stop-color="#f08a1d"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243044"/>
      <stop offset="1" stop-color="#141c28"/>
    </linearGradient>
  </defs>

  <!-- 底：亮琥珀圆角方，深色任务栏上也能跳出来 -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffe6b8" stroke-opacity=".55" stroke-width="8"/>

  <!-- 角 -->
  <path d="M150 150 C120 96 168 74 196 116 Z" fill="#fff6e3"/>
  <path d="M362 150 C392 96 344 74 316 116 Z" fill="#fff6e3"/>

  <!-- 耳 -->
  <ellipse cx="132" cy="214" rx="56" ry="34" fill="url(#ink)" transform="rotate(-18 132 214)"/>
  <ellipse cx="380" cy="214" rx="56" ry="34" fill="url(#ink)" transform="rotate(18 380 214)"/>

  <!-- 头 -->
  <path d="M256 108 C344 108 396 168 396 244 C396 330 336 404 256 404 C176 404 116 330 116 244 C116 168 168 108 256 108 Z" fill="url(#ink)"/>

  <!-- 口鼻 -->
  <ellipse cx="256" cy="322" rx="104" ry="70" fill="#ffe9c9"/>
  <ellipse cx="222" cy="318" rx="15" ry="11" fill="#243044"/>
  <ellipse cx="290" cy="318" rx="15" ry="11" fill="#243044"/>
  <path d="M256 344 q0 18 -22 18 M256 344 q0 18 22 18" stroke="#243044" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- 眼镜：粗框 + 亮蓝镜片，小尺寸也能认出 -->
  <rect x="142" y="188" width="104" height="86" rx="28" fill="#5fc8ff" opacity=".92"/>
  <rect x="266" y="188" width="104" height="86" rx="28" fill="#5fc8ff" opacity=".92"/>
  <rect x="142" y="188" width="104" height="86" rx="28" fill="none" stroke="#141c28" stroke-width="14"/>
  <rect x="266" y="188" width="104" height="86" rx="28" fill="none" stroke="#141c28" stroke-width="14"/>
  <rect x="246" y="222" width="20" height="14" rx="7" fill="#141c28"/>
  <!-- 镜片高光 -->
  <path d="M166 208 l26 -14" stroke="#ffffff" stroke-opacity=".75" stroke-width="10" stroke-linecap="round"/>
  <path d="M290 208 l26 -14" stroke="#ffffff" stroke-opacity=".75" stroke-width="10" stroke-linecap="round"/>

  <!-- 底部绿领带，暗示“上班中” -->
  <rect x="176" y="430" width="160" height="34" rx="17" fill="#5fc46a"/>
</svg>
