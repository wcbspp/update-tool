<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
<meta name="theme-color" content="#0b1220">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>update-tool</title>
<style>
  *{box-sizing:border-box;}


  html,body{height:100%;}

/* ---------- 左侧 ---------- */


  .shead b{font-size:10.5px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;flex:1;}


  .search{margin:0 9px 8px;}


  .search input:focus{outline:none;border-color:#37507a;}


  .tree::-webkit-scrollbar,.res::-webkit-scrollbar,.hl::-webkit-scrollbar,.edta::-webkit-scrollbar{width:9px;height:9px;}


  .tree::-webkit-scrollbar-thumb,.res::-webkit-scrollbar-thumb{background:#2a3342;border-radius:6px;}


  .node .chev{width:11px;text-align:center;color:#5b6577;font-size:8px;flex:none;transition:transform .12s;}


  .node .chev.open{transform:rotate(90deg);}


  .empty{padding:14px 12px;color:#65707f;font-size:12px;line-height:1.8;}


  .sect:hover{color:#8b94a7;}


  .sect .chev{width:11px;text-align:center;font-size:8px;transition:transform .12s;}


  .sect .chev.open{transform:rotate(90deg);}


  .sect .add{background:none;border:none;color:#65707f;cursor:pointer;font-size:13px;padding:0 4px;line-height:1;}


  .sect .add:hover{color:var(--acc);}


  #tip{position:fixed;z-index:99;padding:3px 9px;border-radius:5px;background:#1c2330;border:1px solid #35415a;color:#dfe6f2;font-size:11px;line-height:1.5;pointer-events:none;opacity:0;transition:opacity .08s;white-space:nowrap;transform:translate(-50%,-100%);box-shadow:0 4px 14px #0007;}


  #tip.on{opacity:1;}


  .node .badge{font-size:9.5px;padding:0 6px;border-radius:8px;border:1px solid #2b3648;color:#7f8b9e;max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none;}

/* ---------- 右侧 ---------- */


  section.pane{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;padding:9px 13px 8px;}


  .bar .sp{flex:1;}


  button:disabled{opacity:.35;cursor:not-allowed;}


  .hintline{font-size:11px;color:#5b6577;}

/* ---------- 编辑器 ---------- */


  .ln{flex:none;width:46px;padding:12px 8px 12px 0;text-align:right;color:#414c5e;background:#0d1117;border-right:1px solid var(--line);font:14px/1.75 ui-monospace,Menlo,monospace;overflow:hidden;user-select:none;white-space:pre;}


  .edbox{position:relative;flex:1;min-width:0;}


  .edta{background:transparent;color:transparent;caret-color:#e6edf3;resize:none;outline:none;}


  .edta::selection{background:rgba(79,156,249,.32);color:transparent;}

/* ---------- 结果 ---------- */


  .rz{height:7px;flex:none;cursor:row-resize;display:flex;align-items:center;justify-content:center;margin-top:6px;}


  .rz i{width:46px;height:3px;border-radius:3px;background:#2a3342;}


  .rz:hover i{background:#3d4a60;}


  .rhead .sp{flex:1;}


  .badge.ok{background:#12331d;color:#7ee2a0;border:1px solid #245b31;}


  .badge.warn{background:#33280b;color:#ffd28c;border:1px solid #6b551f;}


  .badge.bad{background:#331216;color:#ffa3a9;border:1px solid #6b2b30;}


  .note.bad{background:#2a1114;color:#ffb3b3;border-bottom-color:#50222a;}


  .stmt.err{background:#1c0f12;}


  .stmt.err .meta{color:#ff9a9a;}


  .stmt.skip .meta{color:#65707f;}


  .stmt.skip .prev{color:#4b5563;}


  table.grid{border-collapse:collapse;margin:2px 10px 8px 44px;font:11px/1.5 ui-monospace,Menlo,monospace;max-width:calc(100% - 60px);}


  table.grid th,table.grid td{border:1px solid var(--line);padding:2px 7px;text-align:left;white-space:nowrap;max-width:300px;overflow:hidden;text-overflow:ellipsis;}

/* ---------- 弹窗 ---------- */


  .mask.on{display:flex;}


  .dlg h3{margin:0 0 10px;font-size:13.5px;display:flex;align-items:center;gap:8px;}


  .dlg h3 .sp{flex:1;}


  .dlg label{display:block;font-size:11px;color:var(--dim);margin:9px 0 3px;}


  .dlg input,.dlg select{width:100%;padding:6px 8px;background:#0a0d13;border:1px solid var(--line);border-radius:5px;color:var(--fg);font-size:12px;}


  .dlg input:focus{outline:none;border-color:#37507a;}


  .dlg .foot{display:flex;justify-content:flex-end;gap:7px;margin-top:14px;}


  .dlg .foot .l{flex:1;}


  .lwrap{flex:1;overflow:auto;border:1px solid var(--line);border-radius:7px;background:#0a0d13;min-height:220px;}


  .lrow{display:grid;grid-template-columns:132px 1fr 52px 46px 96px;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid #151a23;cursor:pointer;font-size:11.5px;}


  .lrow:hover{background:#141a24;}


  .lrow .t{color:#8b94a7;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;}


  .lrow .s{color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}


  .lrow .m{color:#65707f;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;text-align:right;}


  .ldet{padding:8px 12px;background:#0d1219;border-bottom:1px solid #151a23;font:11px/1.6 ui-monospace,Menlo,monospace;color:#9aa6b8;white-space:pre-wrap;}


  .vblock{margin:2px 0 6px;}


  .vtitle{font-size:10.5px;color:var(--dim);letter-spacing:.08em;margin-bottom:6px;}


  .vrow{display:grid;grid-template-columns:230px 1fr;gap:8px;align-items:baseline;padding:3px 0;border-bottom:1px solid #161b24;}


  .vrow .vt{font:11px ui-monospace,Menlo,monospace;color:#8b94a7;overflow:hidden;text-overflow:ellipsis;}


  .vtag{display:inline-block;font:11px ui-monospace,Menlo,monospace;padding:0 8px;border-radius:9px;border:1px solid #245b31;color:#9be3a8;margin:0 5px 3px 0;}


  .vtag.bad{border-color:#6b2b30;color:#ff9a9a;background:#2a1114;}


  .toast.ok{border-color:#245b31;color:#9be3a8;}


  .toast.bad{border-color:#6b2b30;color:#ff9a9a;}

/* ================= 视觉层级优化 ================= */


  .node[data-key^="d"] .ico{opacity:.85;}


  .node[data-key^="s"] .lbl{color:#a6b2c4;font-weight:400;}


  .node[data-key^="s"] .ico{opacity:.4;}


  .node.sel .lbl{color:#eaf1fb;font-weight:600;}


  .crumb .badge{font-size:9.5px;color:#7f8b9e;border-color:#232b38;background:#131922;}



  .bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:none;margin:9px 0;}

/* ================= 图标配色 ================= */


  .node .ico svg{width:13px;height:13px;}


  .node[data-key^="d"] .ico{color:#63a6ff;background:#132540;}


  .node[data-key^="g"] .ico{color:#e8ad42;background:#2b2214;}


  .node[data-key^="s"] .ico{color:#7cb8d6;background:#13212a;}


  .node[data-key^="s"] .ico svg{width:12px;height:12px;}


  .node[data-key^="d"] .badge{color:#8fb6f0;border-color:#24344d;background:#111a27;}


  .node[data-key^="g"] .badge{color:#c8a86a;border-color:#3a3221;background:#191510;}


  .sect .dot{width:5px;height:5px;border-radius:50%;flex:none;}


  .sect .dot.blue{background:#5fa2ff;}


  .sect .dot.gray{background:#54607a;}



  .gd-lead{font-size:12.5px;color:#c2cddd;line-height:1.8;margin:0 0 4px;}


  .gdt{width:100%;border-collapse:collapse;margin:4px 0 8px;font-size:11.5px;}


  .gdt th,.gdt td{border:1px solid #232b38;padding:4px 8px;text-align:left;}


  .gdt th{background:#151c27;color:#c9d4e3;font-weight:600;}


  .gdt td{color:#a9b5c6;font-family:ui-monospace,Menlo,monospace;}


  .gd-warn{color:#f0a45a !important;}


  .gd-warn-p{color:#d9b48a !important;border-left:2px solid #7a4a1e;padding-left:9px;}



  mark.hl{background:#1b2c48;color:#a8c8ff;padding:0 5px;border-radius:4px;font-weight:600;}


  mark.hl-warn{background:#3a2110;color:#f0b070;padding:0 5px;border-radius:4px;font-weight:600;}

/* 头部按钮：去掉点击后残留的蓝色焦点块 */


  header button{font-size:11.5px;background:#171d27;border:1px solid #232b38;color:#c9d4e3;}


  header button:hover{background:#1d2431;border-color:#33405a;color:#e6ecf6;}


  header button:focus{outline:none;}


  header button:focus-visible{outline:2px solid #2f4d73;outline-offset:1px;}



  .dlg.wide{width:720px;display:flex;flex-direction:column;padding:14px 14px 10px;max-height:78vh;overflow:hidden;}


  .dlg.wide .gscroll{flex:1;min-height:0;overflow:auto;padding-right:8px;}


  .dlg.wide h3{flex:none;}


  .dlg.wide .foot{flex:none;margin-top:10px;}

/* ================= 质感与层次 ================= */



  button{color:var(--fg);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px;transition:.12s;background:linear-gradient(180deg,#1b222e,#141a24);border:1px solid #2a3444;box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 1px 2px rgba(0,0,0,.5);}


  button:hover{background:linear-gradient(180deg,#232c3a,#18202b);border-color:#3a4760;}


  button:active{background:#141a24;box-shadow:inset 0 2px 5px rgba(0,0,0,.65);}


  button.primary{font-weight:600;background:linear-gradient(180deg,#5fa2ff,#3a7fe0);border-color:#4b8ded;color:#04101f;box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 2px 10px -2px rgba(95,162,255,.55);}


  button.primary:hover{background:linear-gradient(180deg,#70adff,#4287ea);}


  button.danger{background:linear-gradient(180deg,#e05762,#bd3944);border-color:#c94450;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 2px 10px -3px rgba(224,87,98,.5);}


  button.danger:hover{border-color:#7a343c;background:linear-gradient(180deg,#ea646f,#c64450);}


  button.accent{background:linear-gradient(180deg,#2b5fa8,#1e4a86);border-color:#3a6cb5;color:#dce9ff;box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 1px 3px rgba(0,0,0,.45);}


  button.accent:hover{background:linear-gradient(180deg,#356fbf,#245699);border-color:#4a80c9;color:#eaf3ff;}


  .node .ico{text-align:center;font-size:12px;display:flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:5px;flex:none;opacity:1;box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 1px 2px rgba(0,0,0,.5);}



  .search input{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:6px;color:var(--fg);border-color:#1f2735;font-size:11.5px;background:#0a0e15;box-shadow:inset 0 1px 4px rgba(0,0,0,.6);}


  .search input:focus{box-shadow:inset 0 1px 4px rgba(0,0,0,.6), 0 0 0 2px rgba(95,162,255,.25);}


  .mask{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;background:radial-gradient(900px 500px at 50% 40%, rgba(10,14,22,.72), rgba(4,6,10,.88));}


  .niuma:hover{background:linear-gradient(180deg,#18202c,#121924);border-color:#2c3648;}


  .niuma:active{transform:translateY(0);}


  .nm-ico{display:inline-block;font-size:17px;line-height:1;flex:0 0 auto;
    animation:nmbob 3.4s ease-in-out infinite;}


  .nm-col{display:flex;flex-direction:column;line-height:1.35;min-width:0;}


  .nm-txt{font-size:11.5px;color:#9aa7ba;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}


  .nm-sub{font-size:10px;color:#6b7789;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}


  @keyframes nmbob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-2px) rotate(1.5deg)}}


  @media (prefers-reduced-motion: reduce){ .nm-ico{animation:none;} .niuma{transition:none;} }


  .dot.blue{background:#5fa2ff;}


  .dot.gray{background:#54607a;}

/* ================= 字体与按钮可读性 ================= */


  .dot{width:5px;height:5px;border-radius:50%;flex:none;background:#3a4452;box-shadow:none;}


  .dot.ok{background:#3fb950;box-shadow:0 0 0 2px rgba(63,185,80,.14);}


  .dot.fail{background:#f0616d;box-shadow:0 0 0 2px rgba(240,97,109,.14);}


  #who .dot{display:inline-block;vertical-align:middle;margin-right:5px;}



  .node{position:relative;display:flex;align-items:center;padding:0 26px 0 6px;border-radius:5px;cursor:pointer;user-select:none;gap:6px;height:31px;}


  .node .acts button{width:19px;height:19px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;border:1px solid #2a3444;background:#1b2230;color:#9aa6b8;font-size:12px;line-height:1;transition:.12s;}


  .node .acts button:hover{background:#27313f;border-color:#3d4d68;color:#eef3fb;}


  .node .acts button:active{transform:translateY(1px);}



  .dot.partial{background:#e0a33a;box-shadow:0 0 0 2px rgba(224,163,58,.14);}


  .badge.prod{color:#ffb0b6;border-color:#5d2a30;background:#2a1216;}


  .badge.test{color:#a8c8ff;border-color:#24344d;background:#111a27;}

/* 选中行右侧只露一个 ⋯，不给整行铺渐变块 */


  .node .acts{gap:3px;position:absolute;right:3px;top:50%;transform:translateY(-50%);display:none;align-items:center;}


  .node:hover .acts,.node.sel .acts{display:flex;}


  .node .acts button.more{width:18px;height:18px;padding:0;display:flex;align-items:center;justify-content:center;background:none;border:0;border-radius:4px;color:#7f8b9e;cursor:pointer;font-size:14px;line-height:1;}


  .node .acts button.more:hover{background:#232c3a;color:#dfe6f2;}


  #rowmenu{position:fixed;z-index:60;min-width:132px;padding:4px;background:#161c25;border:1px solid #2d3646;border-radius:8px;box-shadow:0 10px 30px #000a;}


  #rowmenu button{display:block;width:100%;text-align:left;padding:6px 10px;background:none;border:0;border-radius:5px;color:#dbe3ef;font-size:12px;cursor:pointer;white-space:nowrap;}


  #rowmenu button:hover{background:#232c3a;}

/* 悬停时把行数/库名往左让一点，避免被按钮压住 */

  .node:hover .sub{opacity:0;}

/* 徽章始终可见，留出右侧按钮的空间 */

  .node .badge{margin-right:2px;}



  /* 窄窗口（Windows 常见 1280 宽）不挤：隐藏快捷键提示，保住按钮 */
  /* 窄窗口只隐藏快捷键提示，版本与署名始终可见；顶栏允许换行，不裁内容 */
  @media (max-width: 1280px){
    header .who:last-child{display:none}
  }


  header .brand{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;flex:0 1 auto;}


  header .sp{flex:1 1 auto;min-width:8px;}

/* 次级文字提亮，暗屏下更清楚 */



  .badge .dot{display:inline-block;vertical-align:middle;margin-right:4px;width:5px;height:5px;}


  .dot.off{background:#5a6577;box-shadow:none;}

/* ================= 字号上调（1080p 可读） ================= */


  .node .badge{font-size:10px;}


  .bar button{padding:5px 11px;font-size:12.5px;}


  .hl,.edta{position:absolute;inset:0;margin:0;padding:12px 14px;white-space:pre;overflow:auto;tab-size:2;font:14px/1.75 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;border:0;font-size:13.5px;}

/* 左栏布局：列表自己滚动，底部的牛马卡片固定不被挤掉 */


  .tree{overflow:auto;padding:0 6px 12px;flex:1 1 auto;min-height:0;overflow-y:auto;}

/* 牛马卡片跟着列表走，不覆盖文件夹 */


  .niuma{display:flex;align-items:center;gap:9px;margin:6px 9px 11px;padding:8px 10px;border-radius:9px;flex:0 0 auto;
    cursor:pointer;user-select:none;position:relative;overflow:hidden;
    background:linear-gradient(180deg,#151b26,#101620);
    border:1px solid #222b39;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
    transition:background .18s ease, border-color .18s ease;}
  /* 只用一条很淡的竖条表示当前状态，不抢主界面 */
  .niuma::before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:2px;border-radius:2px;
    background:var(--nm-accent,#7d7461);opacity:.5;}

/* 缩放后按比例换算高度，保证整页可见 */


  main{display:grid;grid-template-columns:272px 1fr;overflow:hidden;height:calc(100vh - 46px);}

/* ================= 高对比配色 ================= */


  :root{--panel2:#171c26;--line2:#2d3646;--ok:#3fb950;--bad:#f0616d;--warn:#e0a33a;--kw:#7aa2f7;--str:#9ece6a;--num:#e0af68;--cmt:#5f6a80;--fn:#bb9af7;--bg:#05070b;--panel:#0b1017;--panel2:#141b26;--line:#3a4659;--fg:#f5f9ff;--dim:#b6c4d8;--acc:#5aa9ff;}


  body{margin:0;font:13.5px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;font-size:14.5px;background:#05070b;color:#f5f9ff;}


  aside{box-shadow:inset -1px 0 0 #1c2330;display:flex;flex-direction:column;min-height:0;overflow:hidden;background:linear-gradient(180deg,#0a0f16,#070a0f);border-right:1px solid #39465b;}


  .sect .n{margin-left:auto;letter-spacing:0;font-size:10px;color:#8494a9;}


  .node .badge{color:#cdd9ea;border-color:#46536a;background:#111823;}


  .node:hover{background:#131b26;}


  .node.sel{background:#1c3350;box-shadow:inset 2px 0 0 #5aa9ff;}


  .ed{flex:1;display:flex;min-height:120px;border-radius:8px;overflow:hidden;border:1px solid #1d2530;box-shadow:inset 0 2px 12px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.03);background:#04060a;border-color:#313d4f;}


  .hl{pointer-events:none;color:#e2ebf7;}


  .c{color:#8d9bb5;font-style:italic;}


  .k{color:#ff7ab2;font-weight:700;}


  .s{color:#a8f07c;}


  .n{color:#ffab5e;}


  .f{color:#42e8d0;}


  .tb{color:#c996ff;font-weight:600;}


  .co{color:#5ee0ff;}


  .p{color:#9fb0c9;}


  .hit{background:#3b76e0;color:#ffffff;border-radius:3px;box-shadow:0 0 0 1px #6ea8ff;}


  .note{padding:6px 10px;font-size:11.5px;border-bottom:1px solid #3d3018;background:#33260b;color:#ffd28c;border-bottom-color:#5c451a;}


  .errbox{margin:8px 10px;border:1px solid #6b2b30;padding:8px 10px;border-radius:6px;font:11.5px/1.6 ui-monospace,Menlo,monospace;white-space:pre-wrap;background:#321216;border-color:#7a3038;color:#ffc9c9;}


  table.grid th{font-weight:600;background:#151f2c;color:#eef4fd;border-color:#39465b;}


  table.grid td{color:#cfdaea;border-color:#39465b;}


  .stmt{border-bottom:1px solid #161b24;border-bottom-color:#1e2836;}


  .dlg{width:400px;max-height:88vh;overflow:auto;border:1px solid var(--line2);border-radius:10px;padding:16px 16px 12px;box-shadow:0 30px 90px -24px #000, inset 0 1px 0 rgba(255,255,255,.07);background:linear-gradient(180deg,#101722,#0a0f16);border-color:#3a4659;}

/* ================= 结果区：可读性 + 可点击跳转 ================= */




  .sblock{cursor:pointer;border-left:2px solid transparent;transition:background .12s,border-color .12s;}


  .sblock:hover{background:#0d141d;border-left-color:#5aa9ff;}


  .stmt.jumpable{cursor:pointer;}


  .stmt.jumpable:hover{background:#0d141d;box-shadow:inset 2px 0 0 #5aa9ff;}


  .jump-tip{margin-left:8px;font-size:10.5px;color:#5aa9ff;opacity:0;transition:opacity .12s;}


  .sblock:hover .jump-tip{opacity:1;}


  .chk-t{font-size:13px;color:#eef4fd;}


  .chk-d{font:11px ui-monospace,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;color:#c2cfe1;}


  .chk-s{white-space:nowrap;font-size:11.5px;}


  .sect2{letter-spacing:.11em;text-transform:uppercase;border-top:1px solid #161b24;color:#a6b6cc;font-size:11.5px;padding:11px 12px 6px;}


  .stmt .line{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:baseline;padding:6px 10px;}


  .stmt .prev{font:11.5px ui-monospace,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:#cfdaea;}


  .stmt .idx{color:#4b5563;font:11px ui-monospace,Menlo,monospace;text-align:right;font-size:11.5px;}


  .stmt .meta{font:11px ui-monospace,Menlo,monospace;color:#7ee2a0;white-space:nowrap;font-size:11.5px;}


  .rhead{display:flex;align-items:center;gap:8px;position:sticky;top:0;border-bottom:1px solid var(--line);z-index:1;box-shadow:0 1px 0 #1c2431;background:linear-gradient(180deg,#111a26,#0b1119);border-bottom-color:#39465b;padding:8px 10px;}


  .rhead .chip{font-size:11px;}


  .rhead .badge{font-size:11px;padding:2px 9px;}

/* ================= 最终可读性档位 ================= */

<script>
const $ = id => document.getElementById(id);
let CUR = null, dirty = false, fmtPrev = null, openState = {}, CUR_PRE = true, EDIT_MODE = false, CUR_ENV = 'prod';
let PREVIEWS = [];
let LOGS = [], logFilter = { ok: '', dry: '' };
let PREFLIGHT_ON = true;
// 全局「忙」标记：run / preflight / check / save 其一进行中，禁止再发请求或改结构
let BUSY = '';
// 全局操作序号：切脚本或开始新操作后，旧请求的响应一律丢弃，避免回写到新窗口
let ACT_SEQ = 0;
const BUSY_TEXT = { run: '执行', preflight: '预检', check: '语法校验', save: '保存' };

// 编辑态保护：正在改的脚本不能被删掉（不管改没改过）
function editingGuarded(id, what) {
  if (!EDIT_MODE || CUR !== id) return false;
  toast(`「${what || '这个脚本'}」正在编辑，先保存或退出编辑再删`, 'bad');
  return true;
}
function groupScriptIds(g) {
  const out = [];
  if (!g) return out;
  for (const id of (g.scripts || [])) out.push(id);
  for (const cid of (g.folders || [])) out.push(...groupScriptIds(IDX.g[cid]));
  return out;
}
function busyBlocked() {
  if (!BUSY) return false;
  toast(BUSY === 'run' || BUSY === 'preflight' ? '执行/预检进行中，先等它结束'
    : (BUSY_TEXT[BUSY] || '操作') + '进行中，先等它结束', 'bad');
  return true;
}

const RES_ACTIONS = '<span class="sp"></span>'
  + '<button class="sm" onclick="openResultWindow()" title="在独立窗口打开结果（长结果更好看清、可整页搜索）">⤢</button>'
  + '<button class="sm" onclick="copyRes()">复制</button>';

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// 服务端设了 ACCESS_KEY 时，从地址栏的 ?k= 取值带在每次请求上
const ACCESS_K = new URLSearchParams(location.search).get('k') || '';
function withKey(p) {
  if (!ACCESS_K) return p;
  return p + (p.includes('?') ? '&' : '?') + 'k=' + encodeURIComponent(ACCESS_K);
}
async function api(p, o, timeoutMs) {
  o = o || {};
  const ms = (timeoutMs === undefined) ? 60000 : timeoutMs;
  const ctrl = new AbortController();
  const timer = ms > 0 ? setTimeout(() => ctrl.abort(), ms) : null;
  let r;
  try {
    r = await fetch(withKey(p), Object.assign({}, o, { signal: ctrl.signal }));
  } catch (e) {
    clearTimeout(timer);
    if (e && e.name === 'AbortError') throw new Error('请求超时（' + Math.round(ms / 1000) + ' 秒无响应）：数据库可能连不上，或查询超过了数据源里设置的 DQL 超时');
    throw new Error('无法连接本地服务：程序可能已经退出');
  }
  if (timer) clearTimeout(timer);
  // 先拿文本再解析：出错时后端（或网关）可能返回非 JSON，只有状态码什么也说明不了
  const raw = await r.text();
  let j = {};
  if (raw) { try { j = JSON.parse(raw); } catch (e) { j = {}; } }
  if (!r.ok) {
    const bodyMsg = (j && typeof j.error === 'string' && j.error.trim()) ? j.error.trim() : raw.trim().slice(0, 120);
    throw new Error(bodyMsg || ('HTTP ' + r.status));
  }
  return j;
}
const post = (p, body) => api(p, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
// 长任务：不设前端超时，交给服务端的数据源超时控制
const postLong = (p, body) => api(p, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }, 0);
const del = p => api(p, { method: 'DELETE' });

function toast(t, kind = '') {
  const el = $('toast');
  el.textContent = t; el.className = 'toast on ' + kind;
  clearTimeout(el._t); el._t = setTimeout(() => el.className = 'toast ' + kind, 3200);
}

/* ================= 编辑器高亮 ================= */
const KW = new Set(('SELECT FROM WHERE UPDATE SET INSERT INTO VALUES DELETE JOIN LEFT RIGHT INNER OUTER CROSS ON AND OR NOT NULL IS IN LIKE BETWEEN AS GROUP BY ORDER LIMIT OFFSET DISTINCT CREATE TABLE ALTER DROP TRUNCATE BEGIN COMMIT ROLLBACK START TRANSACTION CASE WHEN THEN ELSE END UNION ALL EXISTS INTERVAL DAY HOUR MINUTE SECOND SHOW DATABASES EXPLAIN DESCRIBE DESC ASC HAVING WITH DUPLICATE KEY IGNORE REPLACE').split(' '));
const FN = new Set(('COUNT SUM MAX MIN AVG NOW DATE_SUB DATE_ADD DATEDIFF TIMESTAMPDIFF CONCAT CONCAT_WS IFNULL IFNULL IF COALESCE SUBSTRING SUBSTR REPLACE TRIM LTRIM RTRIM CAST CONVERT GROUP_CONCAT CURDATE CURTIME CURRENT_DATE CURRENT_TIMESTAMP UNIX_TIMESTAMP FROM_UNIXTIME ABS ROUND CEIL FLOOR LENGTH CHAR_LENGTH UPPER LOWER LPAD RPAD DATE FORMAT STR_TO_DATE LAST_DAY').split(' '));

function matchParen(toks, at) {
  let d = 0;
  for (let k = at; k < toks.length; k++) {
    const tk = toks[k];
    if (tk.t === 'p' && tk.s === '(') d++;
    else if (tk.t === 'p' && tk.s === ')') { d--; if (!d) return k; }
  }
  return -1;
}

function tokenizeSQL(src) {
  const re = /(--[^\n]*|\/\*[\s\S]*?\*\/)|('(?:''|[^'])*'|"(?:[^"\n])*"|`(?:[^`])*`)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_$]*)|([(),;])/g;
  const out = []; let m;
  while ((m = re.exec(src))) {
    out.push({ t: m[1] ? 'c' : m[2] ? 's' : m[3] ? 'n' : m[4] ? 'w' : 'p', s: m[0], i: m.index, j: re.lastIndex });
  }
  return out;
}

// 找每条 INSERT 的表名、列清单、以及 VALUES 起始位置
function insertStructures(toks) {
  const list = [];
  for (let n = 0; n < toks.length; n++) {
    const tk = toks[n];
    if (!(tk.t === 'w' && tk.s.toUpperCase() === 'INSERT')) continue;
    let k = n + 1;
    while (k < toks.length && !(toks[k].t === 'w' && toks[k].s.toUpperCase() === 'INTO')) {
      if (toks[k].t === 'p' && toks[k].s === ';') break;
      k++;
    }
    if (!(toks[k] && toks[k].s.toUpperCase() === 'INTO')) continue;
    k++;
    while (k < toks.length && toks[k].t !== 'w') k++;
    if (!toks[k]) continue;
    const table = k;
    k++;
    let p = k;
    while (p < toks.length && toks[p].t !== 'p') p++;
    let cols = [];
    if (toks[p] && toks[p].s === '(') {
      const close = matchParen(toks, p);
      if (close > 0) {
        let d = 0;
        for (let x = p; x <= close; x++) {
          const t2 = toks[x];
          if (t2.t === 'p' && t2.s === '(') d++;
          else if (t2.t === 'p' && t2.s === ')') d--;
          else if (d === 1 && t2.t === 'w') cols.push(x);
        }
        k = close + 1;
      }
    }
    list.push({ insert: n, table, cols, after: k });
  }
  return list;
}

// 光标落在 VALUES 的某个值 / INSERT..SELECT 的某个选列上时，返回对应的插入列
function valueLink(toks, st, caret) {
  let k = st.after, mode = '';
  for (; k < toks.length; k++) {
    const tk = toks[k];
    if (tk.t === 'w') {
      const up = tk.s.toUpperCase();
      if (up === 'VALUES') { mode = 'values'; k++; break; }
      if (up === 'SELECT') { mode = 'select'; k++; break; }
      if (up === 'INSERT') return null;
    }
    if (tk.t === 'p' && tk.s === ';') return null;
  }
  if (!mode) return null;

  if (mode === 'values') {
    for (; k < toks.length; k++) {
      const tk = toks[k];
      if (tk.t === 'p' && tk.s === ';') return null;
      if (tk.t === 'w' && tk.s.toUpperCase() === 'INSERT') return null;
      if (!(tk.t === 'p' && tk.s === '(')) continue;
      const close = matchParen(toks, k);
      if (close < 0) return null;
      if (caret >= tk.i && caret <= toks[close].j) {
        let d = 0, idx = 0;
        for (let x = k; x <= close; x++) {
          const t2 = toks[x];
          if (t2.t === 'p' && t2.s === '(') d++;
          else if (t2.t === 'p' && t2.s === ')') d--;
          else if (d === 1 && t2.t === 'p' && t2.s === ',' && t2.i < caret) idx++;
        }
        if (idx >= st.cols.length) return null;
        return { col: st.cols[idx] };
      }
      k = close;
    }
    return null;
  }

  // INSERT ... SELECT：按顶层逗号切选列，光标所在的第 n 个选列对应第 n 个插入列
  let d = 0, startTok = k, endTok = k;
  const ranges = [];
  for (; k < toks.length; k++) {
    const tk = toks[k];
    if (tk.t === 'p' && tk.s === '(') d++;
    else if (tk.t === 'p' && tk.s === ')') d--;
    else if (d === 0 && ((tk.t === 'p' && tk.s === ',') || (tk.t === 'w' && /^(FROM|INSERT|UNION)$/.test(tk.s.toUpperCase())) || (tk.t === 'p' && tk.s === ';'))) {
      ranges.push([startTok, endTok]);
      if (!(tk.t === 'p' && tk.s === ',')) break;
      startTok = endTok = k + 1;
      continue;
    }
    if (toks[k].t !== 'p' || toks[k].s !== ',') endTok = k;
  }
  if (ranges.length && endTok >= startTok && endTok < toks.length) {
    if (!ranges.length || ranges[ranges.length - 1][1] < startTok) ranges.push([startTok, endTok]);
  }
  for (let n = 0; n < ranges.length; n++) {
    const a = toks[ranges[n][0]], b = toks[ranges[n][1]];
    if (!a || !b) continue;
    if (caret >= a.i && caret <= b.j) {
      if (n >= st.cols.length) return null;
      return { col: st.cols[n] };
    }
  }
  return null;
}

// 反向：给了插入列序号，找出下面 VALUES / SELECT 里对应的第 n 项
function columnTargets(toks, st, idx) {
  const hits = [];
  let k = st.after, mode = '';
  for (; k < toks.length; k++) {
    const tk = toks[k];
    if (tk.t === 'w') {
      const up = tk.s.toUpperCase();
      if (up === 'VALUES') { mode = 'v'; k++; break; }
      if (up === 'SELECT') { mode = 's'; k++; break; }
      if (up === 'INSERT') return hits;
    }
    if (tk.t === 'p' && tk.s === ';') return hits;
  }
  if (mode === 'v') {
    for (; k < toks.length; k++) {
      const tk = toks[k];
      if (tk.t === 'p' && tk.s === ';') break;
      if (tk.t === 'w' && tk.s.toUpperCase() === 'INSERT') break;
      if (!(tk.t === 'p' && tk.s === '(')) continue;
      const close = matchParen(toks, k);
      if (close < 0) break;
      let d = 0, n = 0;
      for (let x = k; x <= close; x++) {
        const t2 = toks[x];
        if (t2.t === 'p' && t2.s === '(') { d++; continue; }
        if (t2.t === 'p' && t2.s === ')') { d--; continue; }
        if (d !== 1) continue;
        if (t2.t === 'p' && t2.s === ',') { n++; continue; }
        if (n === idx) { hits.push(x); break; }
      }
      k = close;
    }
    return hits;
  }
  if (mode === 's') {
    let d = 0, n = 0, first = -1;
    for (; k < toks.length; k++) {
      const tk = toks[k];
      if (tk.t === 'p' && tk.s === '(') d++;
      else if (tk.t === 'p' && tk.s === ')') d--;
      else if (d === 0 && ((tk.t === 'p' && tk.s === ',') || (tk.t === 'w' && /^(FROM|INSERT|UNION)$/.test(tk.s.toUpperCase())) || (tk.t === 'p' && tk.s === ';'))) {
        if (n === idx && first >= 0) hits.push(first);
        if (!(tk.t === 'p' && tk.s === ',')) break;
        n++; first = -1;
      }
      if (d === 0 && first < 0 && tk.t !== 'p') first = k;
    }
    if (n === idx && first >= 0) hits.push(first);
    return hits;
  }
  return hits;
}

function analyzeSQL(toks, caret) {
  const cls = toks.map(tk => ({ c: 'c', s: 's', n: 'n', p: 'p' }[tk.t] || ''));
  const hit = new Set();
  let expectTable = false;
  for (let n = 0; n < toks.length; n++) {
    const tk = toks[n];
    if (tk.t !== 'w') continue;
    const up = tk.s.toUpperCase();
    if (KW.has(up)) {
      cls[n] = 'k';
      expectTable = /^(INTO|FROM|UPDATE|JOIN|TABLE|USING)$/.test(up);
      continue;
    }
    if (expectTable) { cls[n] = 'tb'; expectTable = false; continue; }
    if (FN.has(up)) cls[n] = 'f';
  }
  const sts = insertStructures(toks);
  for (const st of sts) {
    for (const c of st.cols) cls[c] = 'co';
  }
  if (caret != null && caret >= 0) {
    for (const st of sts) {
      if (caret < toks[st.insert].i) continue;
      const link = valueLink(toks, st, caret);
      if (link) { hit.add(link.col); break; }
      const ci = st.cols.findIndex(c => toks[c].i <= caret && caret <= toks[c].j);
      if (ci >= 0) {
        hit.add(st.cols[ci]);
        for (const t of columnTargets(toks, st, ci)) hit.add(t);
        break;
      }
    }
  }
  return { cls, hit };
}

function highlight(src, caret) {
  const toks = tokenizeSQL(src);
  const { cls, hit } = analyzeSQL(toks, caret);
  let out = '', last = 0;
  for (let n = 0; n < toks.length; n++) {
    const tk = toks[n];
    if (tk.i > last) out += esc(src.slice(last, tk.i));
    const c = hit.has(n) ? 'hit' : cls[n];
    out += c ? `<span class="${c}">${esc(tk.s)}</span>` : esc(tk.s);
    last = tk.j;
  }
  return out + esc(src.slice(last));
}

/* 高亮重绘：大 SQL 每键全量分词会把主线程卡住，这里做三件事
   1) requestAnimationFrame 合并同一帧内的多次调用；2) 输入法组字期间不重绘；
   3) 超过 PAINT_MAX 字符直接降级为纯文本，不跑分词。 */
const PAINT_MAX = 50000;
let PAINT_SIG = '';
let PAINT_LINES = 0;
let PAINT_RAF = 0;
let IME_BUSY = false;

function paint() {
  if (IME_BUSY) return;      // 组字中重绘会打断输入法候选
  if (PAINT_RAF) return;     // 本帧已经排过队了
  PAINT_RAF = requestAnimationFrame(() => { PAINT_RAF = 0; paintNow(); });
}

function countLines(src) {
  let n = 1;
  for (let i = src.indexOf('\n'); i >= 0; i = src.indexOf('\n', i + 1)) n++;
  return n;
}

function paintNow() {
  if (IME_BUSY) return;
  const ta = $('sql'), src = ta.value;
  const big = src.length > PAINT_MAX;
  const sig = src.length + '|' + ta.selectionStart + '|' + ta.selectionEnd + (big ? '|big' : '');
  if (sig !== PAINT_SIG || $('hl').dataset.empty === '1') {
    PAINT_SIG = sig;
    $('hl').dataset.empty = '0';
    if (big) $('hl').textContent = src + '\n';                     // 降级：纯文本
    else $('hl').innerHTML = highlight(src, ta.selectionStart) + '\n';
  }
  const n = countLines(src);
  // 行号只在行数变了才重建，光移光标不重刷
  if (n !== PAINT_LINES) {
    PAINT_LINES = n;
    let g = '';
    for (let i = 1; i <= n; i++) g += i + '\n';
    $('ln').style.whiteSpace = 'pre';
    $('ln').textContent = g;
  }
  syncScroll();
}

function syncScroll() {
  const ta = $('sql');
  $('hl').scrollTop = ta.scrollTop; $('hl').scrollLeft = ta.scrollLeft;
  $('ln').scrollTop = ta.scrollTop;
}

/* ================= 弹窗 ================= */
function dialog({ title, fields, okText = '保存', onDelete, extraLabel, onExtra, wide, validate, onSubmit }) {
  return new Promise(resolve => {
    const body = fields.map(f => {
      if (f.type === 'db') {
        return `<label>${f.label}</label>
          <input id="f_${f.k}" value="${f.value == null ? '' : esc(f.value)}" placeholder="${f.placeholder || ''}" autocomplete="off">
          <div class="dblistBox" id="dblistBox"></div>`;
      }
      if (f.type === 'select') {
        return `<label>${f.label}</label>
          <select id="f_${f.k}">${(f.options || []).map(o =>
            `<option value="${o.v}" ${o.v === f.value ? 'selected' : ''}>${esc(o.t)}</option>`).join('')}</select>`;
      }
      return `<label>${f.label}</label>
        <input id="f_${f.k}" type="${f.type || 'text'}" value="${f.value == null ? '' : esc(f.value)}" placeholder="${f.placeholder || ''}">`;
    }).join('');

    const dlg = $('dlg');
    dlg.className = 'dlg' + (wide ? ' wide' : '');
    dlg.innerHTML = `<h3>${esc(title)}</h3>${body}
      <div id="dlgMsg" style="font-size:11.5px;margin-top:9px;min-height:15px;line-height:1.45"></div>
      <div class="foot">
        ${onDelete ? '<button class="danger" id="dlgDel">删除</button>' : ''}
        ${extraLabel ? `<button id="dlgExtra">${extraLabel}</button>` : ''}
        <span class="l"></span>
        <button id="dlgCancel">取消</button>
        <button class="primary" id="dlgOk">${okText}</button>
      </div>`;
    $('mask').classList.add('on');
    const inputs = [...dlg.querySelectorAll('input,select')];
    if (inputs[0]) setTimeout(() => inputs[0].focus(), 30);

    const read = () => { const o = {}; fields.forEach(f => o[f.k] = $('f_' + f.k).value); return o; };
    /* 关窗顺手摘掉回车处理：#dlg 是共享容器，后面的设置弹窗里没有 #dlgOk，
       留着上一轮的 onkeydown 会在按回车时抛 TypeError */
    const close = v => { dlg.onkeydown = null; $('mask').classList.remove('on'); resolve(v); };
    const setMsg = (t, color) => { const box = $('dlgMsg'); if (!box) return; box.textContent = t; box.style.color = color || 'var(--bad)'; };

    /* 提交：先本地校验，再（可选）等后端落地；任一步失败都留在窗口里显示原因 */
    $('dlgOk').onclick = async () => {
      const v = read();
      if (validate) {
        const bad = validate(v);
        if (bad) { setMsg(bad); return; }
      }
      if (!onSubmit) { close(v); return; }
      const btn = $('dlgOk');
      if (btn) btn.disabled = true;
      setMsg('保存中…', 'var(--dim)');
      try {
        await onSubmit(v);
        close(v);
      } catch (e) {
        setMsg((e && e.message) || '保存失败');
        if (btn) btn.disabled = false;
      }
    };
    $('dlgCancel').onclick = () => close(null);
    if (onDelete) $('dlgDel').onclick = () => { if (confirm('确认删除？不可恢复')) close({ __delete: true }); };
    if (extraLabel && onExtra) $('dlgExtra').onclick = async () => {
      const box = $('dlgMsg');
      box.textContent = '连接中…'; box.style.color = 'var(--dim)';
      try {
        const r = await onExtra(read());
        box.textContent = (r.ok ? '✔ ' : '✘ ') + (r.ok ? r.output + (r.databases && r.databases.length ? `　·　共 ${r.databases.length} 个库，点下方库名选择` : '') : r.error);
        box.style.color = r.ok ? 'var(--ok)' : 'var(--bad)';
        if (r.ok && r.databases && r.databases.length) {
          const box = $('dblistBox');
          if (box) {
            box.innerHTML = r.databases.map(d =>
              `<span class="dbchip" data-v="${esc(d)}">${esc(d)}</span>`).join('');
            box.querySelectorAll('.dbchip').forEach(el => {
              el.onclick = () => {
                const inp = $('f_database');
                if (inp) { inp.value = el.getAttribute('data-v'); inp.focus(); }
              };
            });
          }
          // 只有一个库时直接填好，省得再选
          if (r.databases.length === 1) {
            const inp = $('f_database');
            if (inp && !inp.value) inp.value = r.databases[0];
          }
        }
      } catch (e) { box.textContent = '✘ ' + e.message; box.style.color = 'var(--bad)'; }
    };

    /* 回车：中间字段跳到下一栏，最后一栏才提交；Esc 由全局监听统一处理 */
    dlg.onkeydown = e => {
      if (e.key !== 'Enter') return;
      const ok = $('dlgOk');
      if (!ok) return;   // 不是 dialog() 拼的窗，交回默认行为
      const idx = inputs.indexOf(document.activeElement);
      if (idx >= 0 && idx < inputs.length - 1) { e.preventDefault(); inputs[idx + 1].focus(); return; }
      e.preventDefault(); ok.click();
    };
  });
}

/* ================= 树 ================= */
let DS = [], FOLDERS = [], ROOT_SCRIPTS = [], DEFAULTS = {};
let IDX = { g: {}, s: {} };

/* 只拉结构并重绘。数据源连通性探测很贵，只在首次加载和用户点「检测连接」时做 */
async function loadTree(withCheck) {
  const r = await api('/api/tree');
  DS = r.datasources || [];
  FOLDERS = r.folders || [];
  ROOT_SCRIPTS = r.rootScripts || [];
  DEFAULTS = r.defaults || {};
  indexTree();
  renderTree();
  updateHealth();
  if (withCheck) checkAllDs();
}

function indexTree() {
  IDX = { g: {}, s: {} };
  const walk = (nodes, path, top) => {
    for (const g of nodes || []) {
      const isTop = !top;
      IDX.g[g.id] = {
        id: g.id, name: g.name, path: path.concat(g.name), isTop,
        scripts: (g.scripts || []).map(x => x.id),
        folders: (g.folders || []).map(x => x.id),
        topId: isTop ? g.id : top.id,
        dsId: isTop ? (g.dsId || '') : (top.dsId || ''),
        dsName: isTop ? (g.dsName || '') : (top.dsName || ''),
        preflight: isTop ? !!g.preflight : !!top.preflight,
        versionCol: isTop ? (g.versionCol || '') : (top.versionCol || ''),
        versionPrefixes: isTop ? (g.versionPrefixes || '') : (top.versionPrefixes || '')
      };
      for (const sc of g.scripts || []) {
        IDX.s[sc.id] = {
          id: sc.id, name: sc.name, lines: sc.lines, groupId: g.id,
          path: path.concat(g.name, sc.name),
          folderName: (isTop ? g.name : top.name),
          ownPreflight: (sc.preflight === undefined ? null : sc.preflight),
          ownVersionCol: sc.versionCol || '',
          ownVersionPrefixes: sc.versionPrefixes || ''
        };
      }
      walk(g.folders, path.concat(g.name), isTop ? g : top);
    }
  };
  walk(FOLDERS, [], null);
  for (const sc of ROOT_SCRIPTS) {
    IDX.s[sc.id] = {
      id: sc.id, name: sc.name, lines: sc.lines, groupId: '', path: [sc.name],
      dsId: sc.dsId || '', dsName: sc.dsName || '',
      preflight: !!sc.preflight, versionCol: sc.versionCol || '', versionPrefixes: sc.versionPrefixes || ''
    };
  }
}

let DS_HEALTH = {};   // id -> 'ok' | 'fail' | undefined

async function checkDs(id, silent) {
  try {
    const r = await postLong('/api/ds/test', { id });
    DS_HEALTH[id] = r.ok ? 'ok' : 'fail';
    if (!silent) {
      toast(r.ok ? ('连接正常 · ' + r.output) : ('连接失败 · ' + (r.error || '')), r.ok ? 'ok' : 'bad');
    }
  } catch (e) {
    DS_HEALTH[id] = 'fail';
    if (!silent) toast(e.message, 'bad');
  }
  renderTree();
  updateHealth();
}

function checkAllDs() { DS.forEach(function (d) { checkDs(d.id, true); }); }

function overallHealth() {
  if (!DS.length) return 'unknown';
  var ok = 0, fail = 0, unknown = 0;
  for (var i = 0; i < DS.length; i++) {
    var h = DS_HEALTH[DS[i].id];
    if (h === 'ok') ok++;
    else if (h === 'fail') fail++;
    else unknown++;
  }
  if (unknown > 0) return 'unknown';
  if (fail === 0) return 'ok';
  return ok === 0 ? 'fail' : 'partial';
}

function healthTip() {
  var lines = [DS.length + ' 个连接'];
  for (var i = 0; i < DS.length; i++) {
    var d = DS[i], h = DS_HEALTH[d.id];
    var tag = h === 'ok' ? '正常' : h === 'fail' ? '失败' : '未检测';
    lines.push('  ' + d.name + '：' + tag);
  }
  return lines.join('\n');
}

function updateHealth() {
  var h = overallHealth();
  var scope = LISTEN_MODE === 'all' ? '局域网' : '本机';
  var label = scope + ' · ' + DS.length + ' 个连接 · ' + Object.keys(IDX.s).length + ' 个脚本';
  $('who').innerHTML = '<span class="hb ' + (h === 'fail' ? 'bad' : 'ok') + '"></span>' + label;
  $('who').title = healthTip();
}

function actCheckDs(key) { checkDs(key.slice(1), false); }

async function actMove(arg) {
  if (busyBlocked()) return;
  const parts = String(arg).split('|');
  const key = parts[0];
  const dir = parts[1] === 'up' ? -1 : 1;
  const kind = key[0] === 'g' ? 'group' : 'script';
  try {
    const r = await post('/api/order', { kind: kind, id: key.slice(1), dir: dir });
    if (r.ok) await loadTree();
    else toast('已经到顶/到底了', 'bad');
  } catch (e) { toast(e.message, 'bad'); }
}

function toggleSection(k) { openState[k] = openState[k] === false; renderTree(); }

// 分区标题的键盘入口：Enter / 空格跟点击走同一条路径（里面的 ＋ 按钮自己处理按键）
function sectKey(e, k) {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  if (e.target !== e.currentTarget) return;
  e.preventDefault();
  toggleSection(k);
}

function subtreeMatch(g, q) {
  if (!q) return true;
  if ((g.scripts || []).some(x => x.name.toLowerCase().includes(q))) return true;
  return (g.folders || []).some(x => subtreeMatch(x, q));
}

let TREE_TIMER = null;
function queueTree() {
  clearTimeout(TREE_TIMER);
  TREE_TIMER = setTimeout(renderTree, 150);
}

function renderTree() {
  closeRowMenu();   // 树一重绘，旧菜单定位的节点就没了，先收掉
  const q = ($('q').value || '').toLowerCase().trim();

  h += `<div class="sect" role="button" tabindex="0" aria-expanded="${dsOpen ? 'true' : 'false'}" onclick="toggleSection('ds')" onkeydown="sectKey(event,'ds')">

      <span class="n">${DS.length}</span>

    </div>`;
  if (dsOpen) {
    if (!DS.length) h += `<div class="empty">还没有连接。<br>点右上「＋」新建一个。</div>`;
    for (const d of DS) {
      const envTxt = d.env === 'test' ? '测试' : '生产';

      const tip = `${d.name}（${envTxt}）\n${d.user}@${d.host}:${d.port}/${d.database || ''}\n状态：${st}`;
      h += `<div class="node" data-key="d${d.id}" title="${esc(tip)}" style="padding-left:16px;padding-right:26px">
        <span class="ico">${iconFor('d')}</span>
        <span class="dot ${DS_HEALTH[d.id] === 'ok' ? 'ok' : DS_HEALTH[d.id] === 'fail' ? 'fail' : ''}"></span>
        <span class="lbl">${esc(d.name)}</span>
        <span class="badge ${d.env === 'test' ? 'test' : 'prod'}">${d.env === 'test' ? '测试' : '生产'}</span>
        <span class="acts"><button class="more" data-act="rowMenu" data-arg="d${d.id}" data-menu="${encodeURIComponent(JSON.stringify([
          ['⟳', 'actCheckDs', 'd' + d.id, '检测连接 / 重连'],
          ['＋', 'actAddGroup', 'd' + d.id, '新建顶层文件夹'],
          ['✚', 'actAddRootScript', 'd' + d.id, '新建单层脚本'],
          ['✎', 'editDs', 'd' + d.id, '编辑连接'],
          ['⇩', 'exportCfg', 'd' + d.id, '导出此连接的配置'],
          ['✕', 'delDs', 'd' + d.id, '删除连接']
        ]))}" title="更多">⋯</button></span>
      </div>`;
    }
    h += `<div style="height:4px"></div>`;
  }

  h += `<div class="sect" style="cursor:default" role="heading" aria-level="2"><span style="width:11px"></span><span class="dot gray"></span>脚本<span class="n">${Object.keys(IDX.s).length}</span></div>`;
  h += foldersHTML(FOLDERS, 0, q);
  for (const sc of ROOT_SCRIPTS) {
    if (q && !sc.name.toLowerCase().includes(q)) continue;
    h += row({ key: 's' + sc.id, depth: 0, ico: '📄', label: sc.name, sub: sc.lines + ' 行',
      badge: sc.dsName || '未挂库', sel: CUR === sc.id,
      acts: [['↑', 'actMove', 's' + sc.id + '|up', '上移'],
             ['↓', 'actMove', 's' + sc.id + '|down', '下移'],
             ['⚙', 'scriptSettings', 's' + sc.id, '脚本设置：数据源 / 预检 / 版本'],
             ['⇩', 'exportCfg', 's' + sc.id, '导出此脚本'],
             ['✎', 'editScript', 's' + sc.id, '重命名'],
             ['✕', 'delScript', 's' + sc.id, '删除脚本']] });
  }
  if (!FOLDERS.length && !ROOT_SCRIPTS.length) {
    h += `<div class="empty">还没有文件夹。<br>在上面的数据源右侧点 ＋ 新建。</div>`;
  }

  $('tree').innerHTML = h;
  bindTree();
}

function foldersHTML(nodes, depth, q) {
  let h = '';
  for (const g of nodes || []) {
    if (!subtreeMatch(g, q)) continue;
    const key = 'g' + g.id;
    // 搜索时忽略折叠状态，命中项必须看得见
    const open = q ? true : openState[key] !== false;
    const isTop = g.dsId !== undefined;
    const kids = (g.folders || []).length + (g.scripts || []).length;
    const acts = [
      ['↑', 'actMove', key + '|up', '上移'],
      ['↓', 'actMove', key + '|down', '下移'],
      ['＋', 'actAddGroup', key, '新建子文件夹'],
      ['✚', 'actAddScript', key, '新建脚本']
    ];
    if (isTop) acts.push(['⚙', 'folderSettings', key, '文件夹设置：数据源 / 预检 / 版本']);
    acts.push(['⇩', 'exportCfg', key, '导出此文件夹'], ['✎', 'editGroup', key, '重命名'], ['✕', 'delGroup', key, '删除文件夹']);

    h += row({
      key, depth: depth + 1, chev: kids > 0, open, ico: '📁', label: g.name,
      sub: (g.scripts || []).length + ' 项',
      badge: '',
      envBadge: '',
      tip: isTop ? (g.name + '\n连接：' + (g.dsName || '未绑定') + (g.dsEnv ? '（' + (g.dsEnv === 'test' ? '测试' : '生产') + '）' : '')) : (g.name + '\n继承上级文件夹'),
      acts
    });
    if (!open) continue;
    h += foldersHTML(g.folders, depth + 1, q);
    for (const sc of g.scripts || []) {
      if (q && !sc.name.toLowerCase().includes(q)) continue;
      h += row({ key: 's' + sc.id, depth: depth + 2, ico: '📄', label: sc.name, sub: sc.lines + ' 行', sel: CUR === sc.id,
        tip: sc.name + '\n' + (g.dsEnv ? (g.dsEnv === 'test' ? '测试库' : '生产库') : '') + ' · 继承文件夹设置',
        acts: [['↑', 'actMove', 's' + sc.id + '|up', '上移'],
               ['↓', 'actMove', 's' + sc.id + '|down', '下移'],
               ['⚙', 'scriptSettings', 's' + sc.id, '脚本设置：预检 / 版本字段'],
               ['⇩', 'exportCfg', 's' + sc.id, '导出此脚本'],
               ['✎', 'editScript', 's' + sc.id, '重命名'],
               ['✕', 'delScript', 's' + sc.id, '删除脚本']] });
    }
  }
  return h;
}

const ICONS = {
  d: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"><ellipse cx="8" cy="3.9" rx="4.9" ry="1.9"/><path d="M3.1 3.9v8.2c0 1 2.2 1.9 4.9 1.9s4.9-.9 4.9-1.9V3.9"/><path d="M3.1 8c0 1 2.2 1.9 4.9 1.9s4.9-.9 4.9-1.9"/></svg>',
  g: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"><path d="M2.1 4.3c0-.6.5-1.1 1.1-1.1h2.9l1.5 1.7h5.2c.6 0 1.1.5 1.1 1.1v6.4c0 .6-.5 1.1-1.1 1.1H3.2c-.6 0-1.1-.5-1.1-1.1V4.3z"/></svg>',
  s: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"><path d="M4.2 2.2h4.6l3.9 3.9v7.7H4.2z"/><path d="M8.8 2.2v3.9h3.9"/></svg>'
};
function iconFor(key) { return ICONS[key[0]] || ''; }

function row({ key, depth, chev, open, ico, label, sub, badge, envBadge, tip, acts, sel }) {
  // 树的可访问性：层级 + 可展开状态都告诉读屏器
  // depth 是为缩进算的（根层脚本是 0，顶层文件夹是 1），aria-level 按语义层次归一
  const lvl = Math.max(1, depth || 0);
  const exp = chev ? ` aria-expanded="${open ? 'true' : 'false'}"` : '';
  return `<div class="node ${sel ? 'sel' : ''}" data-key="${key}" tabindex="0" role="treeitem" aria-level="${lvl}"${exp} title="${esc(tip || label)}" style="padding-left:${4 + depth * 13}px">
    ${chev ? `<span class="chev ${open ? 'open' : ''}">▶</span>` : '<span class="chev"></span>'}
    <span class="ico">${iconFor(key)}</span>
    <span class="lbl">${esc(label)}</span>
    ${envBadge ? `<span class="badge ${envBadge === '测试' ? 'test' : 'prod'}">${envBadge}</span>` : ''}
    ${badge ? `<span class="badge">${esc(badge)}</span>` : ''}
    ${sub ? `<span class="sub">${esc(sub)}</span>` : ''}
    <span class="acts">${(acts && acts.length) ? `<button class="more" data-act="rowMenu" data-arg="${key}" data-menu="${encodeURIComponent(JSON.stringify(acts))}" title="更多">⋯</button>` : ''}</span>
  </div>`;
}

let ROWMENU_BTN = null;   // 打开菜单的 ⋯ 按钮，Esc 关掉菜单后把焦点还给它
function closeRowMenu(restore) {
  const m = document.getElementById('rowmenu');
  if (m) m.remove();
  document.removeEventListener('mousedown', rowMenuOutside, true);
  document.removeEventListener('keydown', rowMenuKey, true);
  window.removeEventListener('scroll', closeRowMenu, true);
  window.removeEventListener('resize', closeRowMenu);
  // restore 只认严格的 true：scroll/resize 把事件对象当第一个参数传进来，不能当成「还焦点」
  if (restore === true && ROWMENU_BTN) {
    // ⋯ 按钮只在悬停/选中时显示；不可见时退回整行，焦点不丢到 body
    const tgt = ROWMENU_BTN.offsetParent ? ROWMENU_BTN : ROWMENU_BTN.closest('.node');
    if (tgt && document.contains(tgt)) tgt.focus();
  }
  ROWMENU_BTN = null;
}
function rowMenuKey(e) {
  if (e.key !== 'Escape') return;
  e.preventDefault();
  e.stopPropagation();
  closeRowMenu(true);
}
function rowMenuOutside(e) {
  const m = document.getElementById('rowmenu');
  if (m && !m.contains(e.target)) closeRowMenu();
}
function rowMenu(key) {
  closeRowMenu();
  const nodeEl = document.querySelector(`.node[data-key="${key}"]`);
  if (!nodeEl) return;
  const btn = nodeEl.querySelector('.acts button');
  let items = [];
  try { items = JSON.parse(decodeURIComponent((btn && btn.dataset.menu) || '')); } catch (e) { return; }
  if (!items.length) return;
  const m = document.createElement('div');
  m.id = 'rowmenu';
  // 执行 / 预检进行中时，结构性操作先置灰，等它结束
  const MUTATE = new Set(['delScript', 'delGroup', 'delDs', 'editDs', 'editScript', 'editGroup',
    'actMove', 'actAddGroup', 'actAddScript', 'actAddRootScript']);
  const editingKey = (EDIT_MODE && CUR) ? 's' + CUR : '';
  m.innerHTML = items.map(a => {
    let off = !!BUSY && MUTATE.has(a[1]);
    let why = '执行/预检进行中，先等它结束';
    if ((a[1] === 'delScript' || a[1] === 'editScript') && editingKey && a[2] === editingKey) {
      off = true; why = '正在编辑这个脚本，先保存或退出编辑';
    }
    return `<button data-fn="${a[1]}" data-arg="${a[2]}"${off ? ` disabled title="${why}"` : ''}>${esc(a[3])}</button>`;
  }).join('');
  document.body.appendChild(m);
  const r = nodeEl.getBoundingClientRect();
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(4, Math.min(r.right - w, window.innerWidth - w - 6)) + 'px';
  m.style.top = (r.bottom + h + 6 > window.innerHeight ? r.top - h - 4 : r.bottom + 4) + 'px';
  m.querySelectorAll('button').forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    if (b.disabled) return;
    const fn = window[b.dataset.fn];
    closeRowMenu();
    if (fn) fn(b.dataset.arg);
  });
  document.addEventListener('mousedown', rowMenuOutside, true);
  document.addEventListener('keydown', rowMenuKey, true);
  ROWMENU_BTN = btn || null;
  window.addEventListener('scroll', closeRowMenu, true);
  window.addEventListener('resize', closeRowMenu);
}

function bindTree() {
  const openNode = el => {
    const key = el.dataset.key, t = key[0], id = key.slice(1);
    if (t === 'd') return;
    if (t === 'g') { openState[key] = openState[key] === false; renderTree(); }
    else selectScript(id);
  };
  $('tree').querySelectorAll('.node').forEach(el => {
    el.onclick = e => {
      if (e.target.dataset.act) return;
      openNode(el);
    };
    // 键盘可达：Enter / 空格跟点击走同一条路径
    el.onkeydown = e => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      if (e.target.dataset.act) return;
      e.preventDefault();
      openNode(el);
    };
  });
  $('tree').querySelectorAll('[data-act]').forEach(b => {
    b.onclick = e => {
      e.stopPropagation();
      const fn = window[b.dataset.act];
      if (fn) fn(b.dataset.arg);
    };
  });
}

/* ================= 数据源 / 文件夹 / 脚本 ================= */
async function editDs(key) {
  if (busyBlocked()) return;
  const id = key ? key.slice(1) : '';
  const ds = id ? DS.find(x => x.id === id) : null;
  const buildBody = v => {
    const body = { id: ds ? ds.id : undefined, name: String(v.name || '').trim(), host: String(v.host || '').trim(),
      port: Number(String(v.port == null ? '' : v.port).trim() || 3306), user: String(v.user || '').trim(),
      database: String(v.database || '').trim(), env: (v.env || 'prod'),
      connSec: Number(v.connSec || 10), dqlSec: Number(v.dqlSec || 60),
      dmlSec: Number(v.dmlSec === '' ? 1800 : v.dmlSec), pfSec: Number(v.pfSec === '' ? 20 : v.pfSec) };
    const pw = v['pass' + 'word'];
    if (pw) body['pass' + 'word'] = pw;
    return body;
  };
  const vals = await dialog({
    title: ds ? '编辑连接' : '新建数据源',
    fields: [
      { k: 'name', label: '名称', value: ds ? ds.name : '生产库' },
      { k: 'host', label: '地址', value: ds ? ds.host : '', placeholder: '127.0.0.1' },
      { k: 'port', label: '端口', value: ds ? ds.port : 3306 },
      { k: 'user', label: '账号', value: ds ? ds.user : '' },
      { k: 'password', label: ds ? '口令（留空不修改）' : '口令', type: 'password', value: '' },
      { k: 'database', label: '库名（可留空，先列出全部）', type: 'db', value: ds ? ds.database : '' },
      { k: 'env', label: '环境（必选）', type: 'select', value: ds ? (ds.env || 'prod') : 'prod',
        options: [{ v: 'prod', t: '生产' }, { v: 'test', t: '测试' }] },
      { k: 'connSec', label: '连接超时（秒，默认 10）', value: ds ? (ds.connSec || 10) : 10 },
      { k: 'dqlSec', label: 'DQL 超时（秒，默认 60）：查询与预检统计', value: ds ? (ds.dqlSec || 60) : 60 },
      { k: 'dmlSec', label: 'DML 超时（秒，默认 1800）：执行写入，0 表示不限', value: ds ? (ds.dmlSec == null ? 1800 : ds.dmlSec) : 1800 },
      { k: 'pfSec', label: '预检查询超时（秒，默认 20，-1 不限）：预检里数行数/查冲突的单条上限', value: ds ? (ds.pfSec === -1 ? -1 : (ds.pfSec || 20)) : 20 }
    ],
    onDelete: ds ? () => {} : null,
    extraLabel: '列出库 / 测试',
    onExtra: v => { const o = { id: ds ? ds.id : undefined, host: v.host, port: Number(v.port || 3306), user: v.user, database: '' }; o['pass' + 'word'] = v['pass' + 'word']; return postLong('/api/ds/test', o); },
    // 提交前先挡住明显填错的，别等后端报错
    validate: v => {
      if (!String(v.name || '').trim()) return '名称不能为空';
      if (!String(v.host || '').trim()) return '地址不能为空（例如 127.0.0.1）';
      if (!String(v.user || '').trim()) return '账号不能为空';
      const p = String(v.port == null ? '' : v.port).trim();
      if (!/^\d+$/.test(p) || Number(p) < 1 || Number(p) > 65535) return '端口必须是 1–65535 的数字';
      return '';
    },
    // 真正落库放在窗口里：失败就不关窗，错误写在 #dlgMsg
    onSubmit: async v => { await post('/api/ds', buildBody(v)); }
  });
  if (!vals) return;
  if (vals.__delete) {
    try { await del('/api/ds?id=' + id); } catch (e) { toast(e.message, 'bad'); return; }
    await loadTree(); toast('已删除', 'ok'); return;
  }
  await loadTree();
  toast(ds ? '已保存' : '已新增数据源', 'ok');
}

async function delDs(key) {
  if (busyBlocked()) return;
  const id = key.slice(1);
  const ds = DS.find(x => x.id === id);
  if (!confirm(`删除数据源「${ds ? ds.name : ''}」？挂它的文件夹会变成「未挂库」。`)) return;
  await del('/api/ds?id=' + id);
  await loadTree();
  if (CUR && !IDX.s[CUR]) clearEditor();
  toast('已删除', 'ok');
}

/* ================= 美化 ================= */
const CLAUSE = ['select', 'from', 'where', 'group by', 'order by', 'having', 'limit', 'offset', 'insert into', 'insert', 'update', 'delete from', 'delete', 'set', 'values', 'union all', 'union', 'left join', 'right join', 'inner join', 'outer join', 'join'];
const WORDY = new Set(('select from where group by order having limit offset insert into values update delete set join left right inner outer on as and or not null is in like between exists case when then else end distinct count sum max min avg asc desc union all create table alter drop truncate rename if primary key default begin commit rollback explain show databases describe').split(' '));

function formatSQL(text) {
  const out = [];
  let i = 0, depth = 0, lineStart = true;
  const push = s => { out.push(s); lineStart = false; };
  const newline = () => {
    while (out.length && /[ \t]$/.test(out[out.length - 1])) out[out.length - 1] = out[out.length - 1].replace(/[ \t]+$/, '');
    if (!lineStart) out.push('\n');
    lineStart = true;
  };
  while (i < text.length) {
    const c = text[i];
    if (c === '-' && text[i + 1] === '-') {
      let j = text.indexOf('\n', i); if (j < 0) j = text.length;
      newline(); push(text.slice(i, j).trimEnd()); newline(); i = j + 1; continue;
    }
    if (c === '/' && text[i + 1] === '*') {
      let j = text.indexOf('*/', i + 2); j = j < 0 ? text.length : j + 2;
      newline(); push(text.slice(i, j)); newline(); i = j; continue;
    }
    if (c === "'" || c === '"' || c === '`') {
      const q = c; let j = i + 1;
      while (j < text.length) {
        if (text[j] === '\\') { j += 2; continue; }
        if (text[j] === q) { if (text[j + 1] === q) { j += 2; continue; } j++; break; }
        j++;
      }
      push(text.slice(i, j)); i = j; continue;
    }
    if (c === '(') { depth++; push(c); i++; continue; }
    if (c === ')') { depth = Math.max(0, depth - 1); push(c); i++; continue; }
    if (c === ';') { push(';'); newline(); i++; while (text[i] === '\n') i++; out.push('\n'); continue; }
    if (/\s/.test(c)) { if (c === '\n') newline(); else if (!lineStart) push(' '); i++; continue; }
    const m = /^[A-Za-z_][A-Za-z0-9_$]*/.exec(text.slice(i));
    if (!m) { push(c); i++; continue; }
    let word = m[0], j = i + word.length;
    const two = /^[ \t\n]+([A-Za-z]+)/.exec(text.slice(j));
    let phrase = word.toLowerCase();
    if (two && ['group', 'order', 'union', 'left', 'right', 'inner', 'outer', 'insert', 'delete'].includes(phrase)) {
      const cand = phrase + ' ' + two[1].toLowerCase();
      if (CLAUSE.includes(cand)) { word = word + ' ' + two[1]; j += two[0].length; phrase = cand; }
    }
    const atTop = depth === 0;
    if (atTop && CLAUSE.includes(phrase) && out.length) newline();
    if (atTop && (phrase === 'and' || phrase === 'or') && out.length) { newline(); push('  '); }
    push(WORDY.has(phrase) ? word.toUpperCase() : word);
    i = j;
  }
  return out.join('').replace(/\n{3,}/g, '\n\n').replace(/[ \t]+\n/g, '\n').trim() + '\n';
}
function formatNow() {
  if (busyBlocked()) return;
  const ta = $('sql');
  fmtPrev = ta.value;
  ta.value = formatSQL(ta.value);
  paint(); dirty = true;
  $('btnUnfmt').style.display = '';
  $('btnUnfmt').disabled = false;
  toast('已美化（可点「还原」退回）', 'ok');
}
function undoFormat() {
  if (fmtPrev == null) return;
  $('sql').value = fmtPrev; paint(); fmtPrev = null; dirty = true;
  $('btnUnfmt').style.display = 'none';
  $('btnUnfmt').disabled = true;

/* ================= 校验 / 预演 / 执行 ================= */
async function preflight(silent, ownerSeq) {
  if (!CUR) { if (!silent) toast('先选一个脚本', 'bad'); return null; }
  if (!silent && busyBlocked()) return null;   // 正在执行/保存时不允许插一个预检
  const info = currentSqlInfo();
  if (!info.text.trim()) { if (!silent) toast('没有 SQL', 'bad'); return null; }
  const seq = ownerSeq || ++ACT_SEQ;
  if (!silent) { BUSY = 'preflight'; sync(); showBusy('数据预检中…'); }
  try {
    const r = await postLong('/api/preflight', { scriptId: CUR, sql: info.text });
    if (seq !== ACT_SEQ) return null;   // 已切脚本：结果不能写进新窗口
    r.selOnly = info.selOnly;
    if (!silent) safeRender(() => renderPreflight(r));
    return r;
  } catch (e) {
    if (seq === ACT_SEQ && !silent) { showErr(e.message); toast(e.message, 'bad'); }
    return null;
  } finally {
    // 所有早退路径都要停转圈，不留残影；切了脚本也要停，否则定时器一直转
    hideBusy();
    if (!silent && seq === ACT_SEQ) { BUSY = ''; sync(); }
  }
}

function versionsHTML(versions) {
  if (!versions || !versions.length) return '';
  let h = `<div class="vblock"><div class="vtitle">本次数据版本</div>`;
  for (const v of versions) {
    if (v.missing) {
      h += `<div class="vrow"><span class="vt">${esc(v.table)}</span><span class="vt">无 ${esc(v.field)} 字段</span></div>`;
      continue;
    }
    if (v.err) {
      h += `<div class="vrow"><span class="vt">${esc(v.table)}</span><span class="vt" style="color:#ff9a9a">${esc(v.err)}</span></div>`;
      continue;
    }
    if (v.note) {
      h += `<div class="vrow"><span class="vt">${esc(v.table)}</span><span class="vt">${esc(v.note)}</span></div>`;
    }
    const ok = (v.ok || []).map(x => `<span class="vtag">${esc(x)}</span>`).join('');
    const bad = (v.other || []).map(x => `<span class="vtag bad">${esc(x)}</span>`).join('');
    h += `<div class="vrow"><span class="vt">${esc(v.table)}</span><span>${ok}${bad}</span></div>`;
  }
  return h + `</div>`;
}

function confirmDialog(title, bodyHTML, okText) {
  return new Promise(resolve => {
    const dlg = $('dlg');
    dlg.className = 'dlg';
    dlg.onkeydown = null;   // 确认框只有 #cOk，不能让 dialog() 的回车处理留在这里
    dlg.innerHTML = `<h3>${esc(title)}</h3>${bodyHTML}
      <div class="foot"><span class="l"></span>
        <button id="cCancel">取消</button>
        <button class="primary" id="cOk">${esc(okText || '执行')}</button></div>`;
    $('mask').classList.add('on');
    const close = v => { $('mask').classList.remove('on'); resolve(v); };
    $('cOk').onclick = () => close(true);
    $('cCancel').onclick = () => close(false);
    setTimeout(() => $('cCancel').focus(), 30);
  });
}

function checkRowHTML(c) {
  const color = c.level === 'error' ? '#ff9a9a' : c.level === 'warn' ? '#f0c070' : '#7ee2a0';
  const label = c.level === 'error' ? '错误' : c.level === 'warn' ? '提醒' : '通过';
  const go = (c.stmt != null && c.stmt >= 0)
    ? `<span class="go" onclick="event.stopPropagation();jumpToStmt(${c.stmt})" title="跳到这条 SQL">跳到 SQL ↗</span>`
    : '';
  const st = (c.stmt != null && c.stmt >= 0) ? c.stmt : -1;
  return `<div class="chk" data-level="${c.level}" data-jump="${st}" onclick="clickCheck(this, ${st})" style="cursor:pointer">
    <span class="chk-t">${esc(c.title || '')}</span>
    ${detailHTML(c)}
    ${go}
    <span class="chk-s" style="color:${color}">${label}</span>
  </div>`;
}

let LAST_CHECKS = [];

function renderPreflight(r) {
  const checks = r.checks || [];
  LAST_CHECKS = checks;
  const errs = checks.filter(c => c.level === 'error').length;
  const warns = checks.filter(c => c.level === 'warn').length;
  const global = checks.filter(c => (c.stmt == null ? 0 : c.stmt) < 0);
  const byStmt = {};
  for (const c of checks) {
    const i = c.stmt == null ? 0 : c.stmt;
    if (i < 0) continue;
    (byStmt[i] = byStmt[i] || []).push(c);
  }

  let html = `<div class="rhead">
    <span class="badge ${errs ? 'bad' : warns ? 'warn' : 'ok'}">${errs ? '有异常' : warns ? '有提醒' : '预检通过'}</span>
    <span class="chip">数据预检</span>
    <span class="chip">${r.count || 0} 条语句</span>
    <span class="chip" title="预检耗时">${r.ms != null ? r.ms + ' ms' : '—'}</span>
    ${r.selOnly ? '<span class="chip" style="color:#e0a33a">仅选中部分</span>' : ''}
    ${errs ? `<span class="chip clickable" style="color:#ff9a9a" onclick="jumpToFirst('error')" title="跳到第一个错误">${errs} 个错误 ↗</span>` : ''}
    ${warns ? `<span class="chip clickable" style="color:#e0a33a" onclick="jumpToFirst('warn')" title="跳到第一个提醒">${warns} 个提醒 ↗</span>` : ''}
    ${RES_ACTIONS}
  </div>`;

  if (r.error) html += `<div class="errbox">${esc(r.error)}</div>`;
  html += versionsHTML(r.versions);

  const idxs = Object.keys(byStmt).map(Number).sort((a, b) => a - b);
  if (!idxs.length && !global.length) {
    html += `<div class="note">没有可检查的 DML（支持 INSERT ... SELECT 和多表 UPDATE）。</div>`;
  }
  PREVIEWS = r.previews || [];
  for (const i of idxs) {
    const cs = byStmt[i];
    const e2 = cs.filter(c => c.level === 'error').length;
    const lvl = e2 ? 'err' : (cs.some(c => c.level === 'warn') ? 'warn' : 'ok');
    let body = '';
    const pv = PREVIEWS[i];
    if (pv) body += `<div class="sqlprev">${esc(pv)}</div>`;
    for (const c of cs) body += checkRowHTML(c);
    html += blockHTML(i, lvl, '语句 ' + (i + 1), stmtSummary(cs), body);
  }
  if (global.length) {
    const e2 = global.filter(c => c.level === 'error').length;
    const lvl = e2 ? 'err' : (global.some(c => c.level === 'warn') ? 'warn' : 'ok');
    let body = '';
    for (const c of global) body += checkRowHTML(c);
    html += blockHTML(-1, lvl, '全局', stmtSummary(global), body);
  }

  $('res').innerHTML = html;
  $('res').scrollTop = 0;
  bindStmtJump();
}

async function check() {
  if (!CUR) return;
  if (busyBlocked()) return;
  const info = currentSqlInfo();   // 和执行走同一套取文逻辑：编辑态有选区就只校验选区
  const text = info.text;
  if (!text.trim()) return toast('没有可校验的 SQL', 'bad');
  const seq = ++ACT_SEQ;
  BUSY = 'check'; sync();
  try {
    showBusy('语法校验中（EXPLAIN，不改数据）…');
    const r = await postLong('/api/check', { scriptId: CUR, sql: text, selOnly: info.selOnly });
    if (seq !== ACT_SEQ) return;
    safeRender(() => renderCheck(r));
    toast(r.ok ? '语法校验通过' : '语法校验发现问题', r.ok ? 'ok' : 'bad');
  } catch (e) {
    if (seq === ACT_SEQ) { showErr(e.message); toast(e.message, 'bad'); }
  } finally {
    BUSY = ''; sync(); hideBusy();
  }
}
function renderCheck(r) {
  const list = r.results || [];
  const bad = list.filter(x => !x.ok).length;
  let html = `<div class="rhead">
    <span class="badge ${r.ok ? 'ok' : 'bad'}">${r.ok ? '通过' : '有问题'}</span>
    <span class="chip">语法校验 · EXPLAIN</span>
    <span class="chip">${r.count || list.length} 条语句</span>
    <span class="chip" title="本次校验的文本范围">${r.selOnly ? '仅选中片段' : '整段'} · ${r.chars || 0} 字符</span>
    <span class="chip" title="校验耗时">${r.ms != null ? r.ms + ' ms' : '—'}</span>
    ${bad ? `<span class="chip" style="color:#ff9a9a">${bad} 条失败</span>` : ''}
    ${RES_ACTIONS}
  </div>`;
  html += `<div class="note">语法校验只读，不会修改数据；DDL 无法静态校验，会跳过。</div>`;
  PREVIEWS = r.previews || [];
  for (const x of list) {
    const p = PREVIEWS[x.i] || '';
    let body = p ? `<div class="sqlprev">${esc(p)}</div>` : '';
    if (!x.ok) body += `<div class="errbox">${esc(x.error || '')}</div>`;
    const sum = x.ok ? (x.skipped ? '跳过（DDL）' : '语法通过') : '语法错误';
    html += blockHTML(x.i, x.ok ? 'ok' : 'err', '语句 ' + (x.i + 1), sum, body);
  }
  $('res').innerHTML = html;
  $('res').scrollTop = 0;
  bindStmtJump();
}

async function run(dryRun) {
  if (!CUR) return;
  if (busyBlocked()) return;          // 连点 / 已有一波在跑，只发一次
  const info = currentSqlInfo();
  const text = info.text;
  const sel = info.selOnly ? text : '';
  if (!text.trim()) return toast('没有可执行的 SQL', 'bad');

  const seq = ++ACT_SEQ;
  BUSY = 'run'; sync();
  try {
    // 执行前自动数据预检（可在「设置」里关掉）
    let pf = null;
    if (CUR_PRE) {
      showBusy('预检中…');
      pf = await preflight(true, seq);
      if (seq !== ACT_SEQ) return;
      if (!pf) {
        // 预检没结果（超时 / 服务端 500）绝不能往下执行
        showErr('预检失败，已中止：没拿到预检结果（超时或服务端报错）');
        toast('预检失败，已中止', 'bad');
        return;
      }
      if (!pf.ok) {
        safeRender(() => renderPreflight(pf));
        toast('数据预检未通过，已中止', 'bad');
        return;
      }
    }
    const warnN = pf ? (pf.checks || []).filter(c => c.level === 'warn').length : 0;

    if (!dryRun) {
      const est = ((pf && pf.checks) || []).filter(c => c.title === '预计影响行数')
        .map(c => `第 ${c.stmt + 1} 条：${esc(c.detail)}`).join('<br>');
      const envBanner = (CUR_ENV === 'prod')
        ? '<div style="margin-bottom:10px;padding:8px 10px;border-radius:6px;background:#2a1216;border:1px solid #5d2a30;color:#ffb0b6;font-size:12px">⚠ 这是<b>生产库</b>，执行后立即生效，确认无误再继续。</div>'
        : '';
      const body = envBanner + versionsHTML((pf && pf.versions) || []) +
        `<div style="margin-top:12px;font-size:12px;color:#9aa6b8;line-height:1.8">
           目标：${esc($('crumb').textContent)}<br>
           ${sel ? '仅执行选中部分' : '执行全部'} · ${(pf && pf.count) || 0} 条语句
           ${est ? '<br><span style="color:#e0a33a">' + est + '</span>' : ''}
         </div>`;
      const okGo = await confirmDialog('确认执行', body, '执行');
      if (seq !== ACT_SEQ) return;
      if (!okGo) { $('res').innerHTML = '<div class="rhead"><span class="chip">已取消</span></div>'; return; }
    }

    showBusy('执行中…');
    const r = await postLong('/api/run', { scriptId: CUR, sql: text, dryRun, versions: (pf && pf.versions) || [] });
    if (seq !== ACT_SEQ) return;
    r.selOnly = info.selOnly;
    safeRender(() => renderRun(r, dryRun, warnN, (pf && pf.versions) || []));
    toast(r.ok ? '执行完成' : '执行失败，已回滚', r.ok ? 'ok' : 'bad');
  } catch (e) {
    if (seq === ACT_SEQ) { showErr(e.message); toast(e.message, 'bad'); }
  } finally {
    // 预检失败 / 取消确认框 / 异常：转圈都在这里收尾
    BUSY = ''; sync(); hideBusy();
  }
}
let BUSY_TIMER = null, BUSY_T0 = 0;

function showBusy(msg) {
  // 只建一次 DOM，之后只改秒数文本：
  // 每帧重绘 innerHTML 会重建转圈元素，CSS 动画从头播放，看起来像在抖。
  hideBusy();
  BUSY_T0 = Date.now();
  $('res').innerHTML = `<div class="busy">
    <div class="spin"></div>
    <div class="busyT">${esc(msg)}</div>
    <div class="busyS"><span class="busyNum">0.0</span> 秒 · 大表统计可能需要几分钟；超时会显示「未计算」</div>
  </div>`;
  const num = $('res').querySelector('.busyNum');
  const paint = () => {
    if (!num) return;
    num.textContent = ((Date.now() - BUSY_T0) / 1000).toFixed(1);
  };
  paint();
  BUSY_TIMER = setInterval(paint, 100);
}

function hideBusy() {
  if (BUSY_TIMER) { clearInterval(BUSY_TIMER); BUSY_TIMER = null; }
}
function showErr(msg) {
  $('res').innerHTML = `<div class="rhead"><span class="badge bad">失败</span></div><div class="errbox">${esc(msg)}</div>`;
}

function renderRun(r, dryRun, warnN, versions) {
  const results = r.results || {};
  const previews = r.previews || [];
  PREVIEWS = previews;
  const count = r.count || previews.length;
  const failedAt = (r.failedAt == null) ? -1 : r.failedAt;
  const ok = !!r.ok;

  let html = `<div class="rhead">
    <span class="badge ${ok ? 'ok' : 'bad'}">${ok ? '成功' : '失败'}</span>
    <span class="chip">${dryRun ? '预演（已回滚）' : '执行'}</span>
    <span class="chip">${count} 条语句</span>
    ${r.selOnly ? '<span class="chip" style="color:#e0a33a">仅选中部分</span>' : ''}
    <span class="chip">${r.ms || 0} ms</span>
    ${RES_ACTIONS}
  </div>`;

  if (versions && versions.length) {
    html += `<div style="padding:8px 10px;border-bottom:1px solid #161b24">${versionsHTML(versions)}</div>`;
  }
  if (warnN > 0) {
    html += `<div class="note">预检有 ${warnN} 个提醒（比如源表为空），已继续执行，可点「预检」查看明细。</div>`;
  }
  if (!ok && failedAt >= 0) {
    const after = Math.max(0, count - failedAt - 1);
    html += `<div class="note bad">第 ${failedAt + 1} 条执行失败 → 已停止；前面的 ${failedAt} 条改动全部回滚，后面 ${after} 条未执行。</div>`;
  }
  if (r.error) html += `<div class="errbox">${esc(r.error)}</div>`;

  let total = 0;
  for (let i = 0; i < count; i++) {
    const x = results[i];
    const failed = i === failedAt;
    const skipped = failedAt >= 0 && i > failedAt;
    let meta = '';
    if (failed) meta = '失败';
    else if (skipped) meta = '未执行';
    else if (x && x.columns) meta = `${(x.rows || []).length} 行` + (x.truncated ? '（仅显示前 500 行）' : '') + (x.ms ? ` · ${x.ms}ms` : '');
    else if (x) { meta = `变更 ${x.affected || 0} 行` + (x.ms ? ` · ${x.ms}ms` : ''); total += x.affected || 0; }
    else meta = '—';

    let body = previews[i] ? `<div class="sqlprev">${esc(previews[i])}</div>` : '';
    if (x && x.columns && x.columns.length) body += tableHtml(x.columns, x.rows || []);
    if (failed && r.error) body += `<div class="errbox">${esc(r.error)}</div>`;
    const lvl = failed ? 'err' : (skipped ? 'warn' : 'ok');
    html += blockHTML(i, lvl, '语句 ' + (i + 1), meta, body);
  }
  $('res').innerHTML = html;
  $('res').scrollTop = 0;
  bindStmtJump();
}
function tableHtml(cols, rows) {
  const head = cols.map(c => `<th>${esc(c)}</th>`).join('');
  const body = rows.length
    ? rows.map(r => `<tr>${r.map(c => `<td>${c === null ? '<span style="color:#5b6577">NULL</span>' : esc(c)}</td>`).join('')}</tr>`).join('')
    : `<tr><td colspan="${cols.length}" style="color:#5b6577">无数据</td></tr>`;
  return `<table class="grid"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}
function copyRes() {
  const txt = $('res').innerText;

// 点提醒 → 跳到编辑器对应语句
// 服务端预览把空白压成了单个空格，所以这里也用同样的压缩方式做匹配
function collapseWs(text) {
  let out = '', map = [], ws = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === ' ' || ch === '\t' || ch === '\n' || ch === '\r') { ws = true; continue; }
    if (ws && out) { out += ' '; map.push(i - 1); }
    ws = false;
    out += ch; map.push(i);
  }
  return { out: out, map: map };
}

function jumpToStmt(i) {
  const pv = (PREVIEWS[i] || '').trim();
  if (!pv) return;
  const ta = $('sql');
  const needle = pv.replace(/…$/, '').trim();
  let start = -1, end = -1;

  // 先按原文（含换行）精确匹配
  const direct = ta.value.indexOf(needle.slice(0, 60));
  if (direct >= 0) {
    start = direct;
    end = direct + Math.min(needle.length, ta.value.length - direct);
  } else {
    // 退回到忽略空白差异的匹配
    const c = collapseWs(ta.value);
    const flat = needle.replace(/\s+/g, ' ').slice(0, 40);
    const hit = c.out.indexOf(flat);
    if (hit >= 0) {
      start = c.map[hit];
      const lastIdx = Math.min(hit + flat.length - 1, c.map.length - 1);
      end = c.map[lastIdx] + 1;
    }
  }
  if (start < 0) { toast('编辑器里找不到这条语句（可能已修改）', 'bad'); return; }

  ta.focus();
  ta.setSelectionRange(start, end);
  const lh = parseFloat(getComputedStyle(ta).lineHeight) || 23;
  const line = ta.value.slice(0, start).split('\n').length;
  ta.scrollTop = Math.max(0, (line - 3) * lh);
  if (typeof syncScroll === 'function') syncScroll();
  flashEditorRange(start, end);
  toast('已跳到第 ' + line + ' 行', 'ok');
}

function jumpToFirst(level) {
  const rows = [...document.querySelectorAll('#res .chk')];
  const target = rows.find(r => r.getAttribute('data-level') === level);
  if (!target) { toast('结果里没有这一类的明细', 'bad'); return; }
  const blk0 = target.closest('.sblock');
  if (blk0 && !blk0.classList.contains('open')) {
    blk0.classList.add('open');
    const b0 = blk0.querySelector('.sbtn');
    if (b0) b0.textContent = '收起';
  }
  flashRow(target);
  const st = Number(target.getAttribute('data-jump'));
  if (!isNaN(st) && st >= 0) jumpToStmt(st);
}

// 把原文里的字符区间映射到高亮层 DOM 并画一条可见色带
function domPos(root, offset) {
  let acc = 0;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = w.nextNode())) {
    const len = n.nodeValue.length;
    if (acc + len >= offset) return { node: n, off: Math.max(0, offset - acc) };
    acc += len;
  }
  return null;
}

function flashEditorRange(start, end) {
  const hl = $('hl');
  if (!hl || start == null || start < 0) return;
  const a = domPos(hl, start), b = domPos(hl, Math.max(start, end || start));
  if (!a || !b) return;
  let rect = null;
  try {
    const r = document.createRange();
    r.setStart(a.node, a.off);
    r.setEnd(b.node, b.off);
    rect = r.getClientRects()[0] || r.getBoundingClientRect();
  } catch (e) { return; }
  if (!rect || !rect.height) return;
  const box = document.querySelector('.edbox');
  if (!box) return;
  // 色带挂在 .edbox 上：随后重绘 #hl.innerHTML 也抹不掉它（原来一闪就没）
  const base = box.getBoundingClientRect();
  const band = document.createElement('div');
  band.className = 'flashband';
  band.style.top = (rect.top - base.top) + 'px';
  band.style.height = rect.height + 'px';
  box.appendChild(band);
  setTimeout(() => band.remove(), 1600);
}

function detailHTML(c) {
  const txt = c.detail || '';
  if ((c.title || '').indexOf('同一张表') >= 0) {
    return txt.split('\n').map(line => {
      const m = line.match(/^第\s*(\d+)\s*条/);
      if (m) {
        const i = Number(m[1]) - 1;
        return `<div class="jline" onclick="event.stopPropagation();jumpToStmt(${i})">${esc(line)}<span class="jgo">跳到第 ${m[1]} 条 ↗</span></div>`;
      }
      return `<div class="jline plain">${esc(line)}</div>`;
    }).join('');
  }
  return `<span class="chk-d" title="${esc(txt)}">${esc(txt)}</span>`;
}

function clickCheck(el, stmt) {
  flashRow(el);              // 先在结果区定位并高亮这条明细
  if (stmt != null && stmt >= 0) jumpToStmt(stmt);
}

function flashRow(sel) {
  const el = typeof sel === 'string' ? document.querySelector(sel) : sel;
  if (!el) return;
  el.scrollIntoView({ block: 'nearest' });
  el.classList.remove('hit');
  void el.offsetWidth;
  el.classList.add('hit');
  setTimeout(() => el.classList.remove('hit'), 1600);
}

function stmtSummary(cs) {
  // 每条检查都列出来，并按结果上色：✓绿、⚠琥珀、✕红（错误加粗）
  const mark = l => l === 'error' ? '✕ ' : l === 'warn' ? '⚠ ' : '✓ ';
  const cls = l => l === 'error' ? 'err' : l === 'warn' ? 'warn' : 'ok';
  const label = c => {
    const t = c.title || '';
    if (t.indexOf('预计影响行数') >= 0) return c.detail || t;
    if (t.indexOf('被更新表') >= 0 || t.indexOf('目标表') >= 0 || t.indexOf('被删除表') >= 0) {
      return t + ' ' + String(c.detail || '').replace(/[（(].*$/, '').trim();
    }
    if (t.indexOf('数据来源表') >= 0) return t + ' ' + String(c.detail || '');
    return t;
  };
  const bits = cs.slice(0, 8).map(c =>
    `<span class="sum"><span class="mk ${cls(c.level)}">${mark(c.level).trim()}</span> ${esc(label(c))}</span>`);
  if (cs.length > 8) bits.push(`<span class="sum more">…还有 ${cs.length - 8} 项</span>`);
  return bits.join('<span class="sumsep">·</span>') || '<span class="sum"><span class="mk ok">✓</span> 通过</span>';
}

function blockHTML(stmt, level, title, summary, body) {
  return `<div class="sblock" data-stmt="${stmt}">
    <div class="shead" tabindex="0" role="button" onkeydown="sheadKey(event,this)">
      <span class="sdot ${level}"></span>
      <span class="stitle">${title}</span>
      <span class="ssum">${summary || ''}</span>
      <span class="sp"></span>
      <button class="sm sbtn" onclick="toggleBlock(this,event)">展开</button>
    </div>
    <div class="sbody">${body}</div>
  </div>`;
}

function sheadKey(e, el) {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    toggleBlock(el.querySelector('.sbtn'), e);
  }
}

function toggleBlock(btn, ev) {
  if (ev) ev.stopPropagation();
  const blk = btn.closest('.sblock');
  if (!blk) return;
  const open = blk.classList.toggle('open');
  btn.textContent = open ? '收起' : '展开';
}

// 渲染失败时给出可见提示，而不是留一块空白
function safeRender(fn) {
  hideBusy();
  try {
    fn();
  } catch (e) {
    const res = $('res');
    if (res) {
      res.innerHTML = `<div class="rhead"><span class="badge bad">渲染失败</span></div>`
        + `<div class="errbox">${esc((e && e.message) || String(e))}</div>`;
    }
  }
}

// 只放行 http / https，挡掉 javascript: data: 这类地址
function safeHttpUrl(u) {
  try {
    const x = new URL(String(u), location.origin);
    if (x.protocol !== 'http:' && x.protocol !== 'https:') return '';
    return x.href;
  } catch (e) { return ''; }
}

function saveB64(name, b64) {
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([buf], { type: 'application/octet-stream' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

async function exportCfg(arg) {

  let scope = 'all', id = '';

  else if (arg && arg[0] === 'g') { scope = 'group'; id = arg.slice(1); }

function fileToB64(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => {
      const s = String(fr.result || '');
      resolve(s.slice(s.indexOf(',') + 1));
    };
    fr.onerror = () => reject(new Error('读取失败'));
    fr.readAsDataURL(file);
  });
}

async function onImportFile() {
  const f = $('impFile').files && $('impFile').files[0];
  if (!f) return;
  if (f.size > 8 * 1024 * 1024) { toast('文件太大，不像是配置文件', 'bad'); return; }
  let b64;
  try { b64 = await fileToB64(f); } catch (e) { toast('读不出来：' + e.message, 'bad'); return; }

  let r;
  try { r = await post('/api/import', { data: b64, mode: 'merge', preview: true }); }
  catch (e) { toast(e.message, 'bad'); return; }

  const mode = await importDialog(r.summary || {}, b64);

      setTimeout(() => toast('这些连接要自己补口令：' + s.needPassword.join('、'), 'bad'), 1700);
    }
  } catch (e) { toast(e.message, 'bad'); }
}

async function openLogs() {
  $('logdlg').innerHTML = `<h3>执行日志 <span class="sp"></span>
