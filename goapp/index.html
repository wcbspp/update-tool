<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>update-tool</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#11151d; --panel2:#171c26; --line:#232a36; --line2:#2d3646;
    --fg:#e6eaf2; --dim:#8b94a7; --acc:#4f9cf9; --ok:#3fb950; --bad:#f0616d; --warn:#e0a33a;
    --kw:#7aa2f7; --str:#9ece6a; --num:#e0af68; --cmt:#5f6a80; --fn:#bb9af7;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font:13.5px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}

  header{height:42px;padding:0 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--panel)}
  header h1{font-size:13.5px;margin:0;font-weight:600;letter-spacing:.01em}
  header .brand{display:flex;align-items:baseline;gap:9px}
  header .ver{font-size:10.5px;color:#5f6a7d;font-family:ui-monospace,Menlo,monospace}
  header .who{font-size:11.5px;color:var(--dim);font-family:ui-monospace,Menlo,monospace}
  main{display:grid;grid-template-columns:272px 1fr;height:calc(100vh - 42px);overflow:hidden}

  /* ---------- 左侧 ---------- */
  aside{border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel);min-height:0}
  .shead{display:flex;align-items:center;gap:6px;padding:10px 10px 7px}
  .shead b{font-size:10.5px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;flex:1}
  .search{margin:0 9px 8px}
  .search input{width:100%;padding:6px 9px;background:#0a0d13;border:1px solid var(--line);border-radius:6px;color:var(--fg);font-size:12px}
  .search input:focus{outline:none;border-color:#37507a}
  .tree{flex:1;overflow:auto;padding:0 6px 12px}
  .tree::-webkit-scrollbar,.res::-webkit-scrollbar,.hl::-webkit-scrollbar,.edta::-webkit-scrollbar{width:9px;height:9px}
  .tree::-webkit-scrollbar-thumb,.res::-webkit-scrollbar-thumb{background:#2a3342;border-radius:6px}
  .node{display:flex;align-items:center;gap:5px;height:27px;padding:0 6px;border-radius:5px;cursor:pointer;user-select:none}
  .node:hover{background:#1a2029}
  .node.sel{background:#182437;box-shadow:inset 2px 0 0 var(--acc)}
  .node .chev{width:11px;text-align:center;color:#5b6577;font-size:8px;flex:none;transition:transform .12s}
  .node .chev.open{transform:rotate(90deg)}
  .node .ico{width:13px;flex:none;text-align:center;font-size:11px;opacity:.7}
  .node .lbl{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
  .node .sub{font-size:10px;color:#65707f;font-family:ui-monospace,Menlo,monospace;max-width:94px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .node .acts{display:none;gap:1px;flex:none}
  .node:hover .acts{display:flex}
  .node .acts button{background:none;border:none;color:#65707f;cursor:pointer;padding:0 2px;font-size:11.5px;line-height:1}
  .node .acts button:hover{color:var(--fg)}
  .empty{padding:14px 12px;color:#65707f;font-size:12px;line-height:1.8}
  .sect{display:flex;align-items:center;gap:5px;padding:9px 6px 5px;font-size:10px;letter-spacing:.11em;color:#5f6a7d;text-transform:uppercase;cursor:pointer;user-select:none}
  .sect:hover{color:#8b94a7}
  .sect .chev{width:11px;text-align:center;font-size:8px;transition:transform .12s}
  .sect .chev.open{transform:rotate(90deg)}
  .sect .n{margin-left:auto;font-size:10px;color:#4b5563;letter-spacing:0}
  .sect .add{background:none;border:none;color:#65707f;cursor:pointer;font-size:13px;padding:0 4px;line-height:1}
  .sect .add:hover{color:var(--acc)}
  #tip{position:fixed;z-index:99;padding:3px 9px;border-radius:5px;background:#1c2330;border:1px solid #35415a;
       color:#dfe6f2;font-size:11px;line-height:1.5;pointer-events:none;opacity:0;transition:opacity .08s;white-space:nowrap;
       transform:translate(-50%,-100%);box-shadow:0 4px 14px #0007}
  #tip.on{opacity:1}
  .node .badge{font-size:9.5px;padding:0 6px;border-radius:8px;border:1px solid #2b3648;color:#7f8b9e;max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}

  /* ---------- 右侧 ---------- */
  section.pane{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;padding:9px 13px 8px}
  .crumb{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#65707f;height:19px;flex:none}
  .crumb b{color:var(--fg);font-weight:600;font-size:13px;font-family:ui-monospace,Menlo,monospace}
  .bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:7px 0;flex:none}
  .bar .sp{flex:1}
  button{background:var(--panel2);border:1px solid var(--line);color:var(--fg);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px;transition:.12s}
  button:hover{border-color:#3c4a61;background:#1c2330}
  button:disabled{opacity:.35;cursor:not-allowed}
  button.primary{background:var(--acc);border-color:var(--acc);color:#04101f;font-weight:600}
  button.primary:hover{background:#67aafb}
  button.danger{background:#39151a;border-color:#5f2a31;color:#ff9a9a}
  button.danger:hover{background:#451a20;border-color:#7a343c}
  button.sm{padding:3px 8px;font-size:11px}
  .hintline{font-size:11px;color:#5b6577}

  /* ---------- 编辑器 ---------- */
  .ed{flex:1;display:flex;min-height:120px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#0a0d12}
  .ln{flex:none;width:46px;padding:12px 8px 12px 0;text-align:right;color:#414c5e;background:#0d1117;
      border-right:1px solid var(--line);font:14px/1.75 ui-monospace,Menlo,monospace;overflow:hidden;user-select:none;white-space:pre}
  .edbox{position:relative;flex:1;min-width:0}
  .hl,.edta{position:absolute;inset:0;margin:0;padding:12px 14px;white-space:pre;overflow:auto;tab-size:2;
    font:14px/1.75 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;border:0}
  .hl{pointer-events:none;color:#cfd8e3}
  .edta{background:transparent;color:transparent;caret-color:#e6edf3;resize:none;outline:none}
  .edta::selection{background:rgba(79,156,249,.32);color:transparent}
  .k{color:var(--kw);font-weight:600}
  .s{color:var(--str)}
  .c{color:var(--cmt);font-style:italic}
  .n{color:var(--num)}
  .f{color:var(--fn)}

  /* ---------- 结果 ---------- */
  .rz{height:7px;flex:none;cursor:row-resize;display:flex;align-items:center;justify-content:center;margin-top:6px}
  .rz i{width:46px;height:3px;border-radius:3px;background:#2a3342}
  .rz:hover i{background:#3d4a60}
  .res{flex:0 1 auto;height:270px;min-height:90px;max-height:46vh;border:1px solid var(--line);border-radius:8px;overflow:auto;background:#0c1016}
  .rhead{display:flex;align-items:center;gap:8px;padding:7px 10px;position:sticky;top:0;background:#0f141c;border-bottom:1px solid var(--line);z-index:1}
  .rhead .sp{flex:1}
  .badge{font-size:10.5px;padding:1px 8px;border-radius:9px;font-weight:600}
  .badge.ok{background:#12331d;color:#7ee2a0;border:1px solid #245b31}
  .badge.warn{background:#33280b;color:#ffd28c;border:1px solid #6b551f}
  .badge.bad{background:#331216;color:#ffa3a9;border:1px solid #6b2b30}
  .chip{font-size:10.5px;color:#8b94a7;font-family:ui-monospace,Menlo,monospace}
  .note{padding:6px 10px;font-size:11.5px;background:#241c0e;color:#f0c070;border-bottom:1px solid #3d3018}
  .note.bad{background:#2a1114;color:#ffb3b3;border-bottom-color:#50222a}
  .errbox{margin:8px 10px;border:1px solid #6b2b30;background:#2a1114;color:#ffb3b3;padding:8px 10px;border-radius:6px;
    font:11.5px/1.6 ui-monospace,Menlo,monospace;white-space:pre-wrap}
  .stmt{border-bottom:1px solid #161b24}
  .stmt .line{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:baseline;padding:5px 10px}
  .stmt .idx{color:#4b5563;font:11px ui-monospace,Menlo,monospace;text-align:right}
  .stmt .prev{font:11.5px ui-monospace,Menlo,monospace;color:#9aa6b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stmt .meta{font:11px ui-monospace,Menlo,monospace;color:#7ee2a0;white-space:nowrap}
  .stmt.err{background:#1c0f12}
  .stmt.err .meta{color:#ff9a9a}
  .stmt.skip .meta{color:#65707f}
  .stmt.skip .prev{color:#4b5563}
  table.grid{border-collapse:collapse;margin:2px 10px 8px 44px;font:11px/1.5 ui-monospace,Menlo,monospace;max-width:calc(100% - 60px)}
  table.grid th,table.grid td{border:1px solid var(--line);padding:2px 7px;text-align:left;white-space:nowrap;max-width:300px;overflow:hidden;text-overflow:ellipsis}
  table.grid th{background:#151b26;color:#c9d4e3;font-weight:600}
  table.grid td{color:#a9b5c6}

  /* ---------- 弹窗 ---------- */
  .mask{position:fixed;inset:0;background:#05070bc4;display:none;align-items:center;justify-content:center;z-index:20}
  .mask.on{display:flex}
  .dlg{width:400px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:16px 16px 12px;box-shadow:0 20px 60px #000b}
  .dlg.wide{width:720px;max-height:76vh;display:flex;flex-direction:column;padding:14px 14px 10px}
  .dlg h3{margin:0 0 10px;font-size:13.5px;display:flex;align-items:center;gap:8px}
  .dlg h3 .sp{flex:1}
  .dlg label{display:block;font-size:11px;color:var(--dim);margin:9px 0 3px}
  .dlg input,.dlg select{width:100%;padding:6px 8px;background:#0a0d13;border:1px solid var(--line);border-radius:5px;color:var(--fg);font-size:12px}
  .dlg input:focus{outline:none;border-color:#37507a}
  .dlg .foot{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}
  .dlg .foot .l{flex:1}
  .lwrap{flex:1;overflow:auto;border:1px solid var(--line);border-radius:7px;background:#0a0d13;min-height:220px}
  .lrow{display:grid;grid-template-columns:132px 1fr 52px 46px 96px;gap:8px;align-items:center;padding:6px 10px;
    border-bottom:1px solid #151a23;cursor:pointer;font-size:11.5px}
  .lrow:hover{background:#141a24}
  .lrow .t{color:#8b94a7;font-family:ui-monospace,Menlo,monospace;font-size:10.5px}
  .lrow .s{color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lrow .m{color:#65707f;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;text-align:right}
  .ldet{padding:8px 12px;background:#0d1219;border-bottom:1px solid #151a23;font:11px/1.6 ui-monospace,Menlo,monospace;color:#9aa6b8;white-space:pre-wrap}
  .sect2{padding:9px 12px 5px;font-size:10px;letter-spacing:.11em;color:#5f6a7d;text-transform:uppercase;border-top:1px solid #161b24}
  .sqlprev{padding:0 12px 7px;font:11px ui-monospace,Menlo,monospace;color:#6f7b8b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chk{display:grid;grid-template-columns:158px 1fr auto;gap:10px;padding:4px 12px;align-items:baseline;border-bottom:1px solid #141922}
  .chk-t{font-size:11.5px;color:#9aa6b8}
  .chk-d{font:11px ui-monospace,Menlo,monospace;color:#8b94a7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chk-s{font-size:10.5px;white-space:nowrap}
  .vblock{margin:2px 0 6px}
  .vtitle{font-size:10.5px;color:var(--dim);letter-spacing:.08em;margin-bottom:6px}
  .vrow{display:grid;grid-template-columns:230px 1fr;gap:8px;align-items:baseline;padding:3px 0;border-bottom:1px solid #161b24}
  .vrow .vt{font:11px ui-monospace,Menlo,monospace;color:#8b94a7;overflow:hidden;text-overflow:ellipsis}
  .vtag{display:inline-block;font:11px ui-monospace,Menlo,monospace;padding:0 8px;border-radius:9px;border:1px solid #245b31;color:#9be3a8;margin:0 5px 3px 0}
  .vtag.bad{border-color:#6b2b30;color:#ff9a9a;background:#2a1114}
  .toast{position:fixed;right:16px;bottom:16px;padding:9px 14px;border-radius:7px;background:#1b212b;border:1px solid var(--line2);font-size:12px;opacity:0;transition:.18s;pointer-events:none;z-index:30}
  .toast.on{opacity:1}
  .toast.ok{border-color:#245b31;color:#9be3a8}
  .toast.bad{border-color:#6b2b30;color:#ff9a9a}

  /* ================= 视觉层级优化 ================= */
  header{height:46px}
  header h1{font-size:14px;font-weight:700;letter-spacing:.02em;color:#eef2f9}
  header .ver{font-size:10px;color:#55606f;letter-spacing:.02em}
  header .who{font-size:11px;color:#6b7688}
  header button{font-size:11.5px}

  aside{background:#0f131a;border-right:1px solid #1c2330}
  .search input{background:#0b0f16;border-color:#1f2735;font-size:11.5px}
  .sect{font-size:9.5px;color:#5a6678;letter-spacing:.14em;padding:11px 8px 6px}
  .sect .n{color:#4a5568;font-size:9.5px}

  .node{height:29px;gap:6px}
  .node .ico{font-size:12px;opacity:.5;width:15px}
  .node .lbl{font-size:12.5px;color:#c8d2e2}
  .node .sub{font-size:9.5px;color:#4f5a6b}
  .node .badge{font-size:9px;color:#6d7a8c;border-color:#232b38;background:#131922}

  .node[data-key^="d"] .lbl{color:#e4ebf6;font-weight:600;font-size:12.5px}
  .node[data-key^="d"] .ico{opacity:.85}
  .node[data-key^="g"] .lbl{color:#ccd7e7;font-weight:500}
  .node[data-key^="s"] .lbl{color:#a6b2c4;font-weight:400}
  .node[data-key^="s"] .ico{opacity:.4}

  .node:hover{background:#161d28}
  .node.sel{background:#16243a;box-shadow:inset 2px 0 0 var(--acc)}
  .node.sel .lbl{color:#eaf1fb;font-weight:600}

  .crumb{font-size:11.5px;color:#586475}
  .crumb b{font-size:14px;color:#eef2f9}
  .crumb .badge{font-size:9.5px;color:#7f8b9e;border-color:#232b38;background:#131922}

  .bar{margin:9px 0}
  .bar button{font-size:11.5px;padding:5px 11px}
  .bar .hintline{font-size:10.5px;color:#4f5a6b}

  /* ================= 图标配色 ================= */
  .node .ico{display:flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:5px;flex:none;opacity:1}
  .node .ico svg{width:13px;height:13px}
  .node[data-key^="d"] .ico{color:#63a6ff;background:#132540}
  .node[data-key^="g"] .ico{color:#e8ad42;background:#2b2214}
  .node[data-key^="s"] .ico{color:#7cb8d6;background:#13212a}
  .node[data-key^="s"] .ico svg{width:12px;height:12px}
  .node[data-key^="d"] .badge{color:#8fb6f0;border-color:#24344d;background:#111a27}
  .node[data-key^="g"] .badge{color:#c8a86a;border-color:#3a3221;background:#191510}
  .sect .dot{width:5px;height:5px;border-radius:50%;flex:none}
  .sect .dot.blue{background:#5fa2ff}
  .sect .dot.gray{background:#54607a}

  .gd-lead{font-size:12.5px;color:#c2cddd;line-height:1.8;margin:0 0 4px}
  #guide h4{margin:16px 0 6px;font-size:12.5px;color:#e6ecf6;font-weight:600}
  #guide p{margin:0 0 6px;color:#a9b5c6;line-height:1.8}
  #guide ul,#guide ol{margin:0 0 6px;padding-left:20px;color:#a9b5c6;line-height:1.85}
  #guide code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:#8fb6f0;background:#12203a;padding:1px 5px;border-radius:4px}
  .gdt{width:100%;border-collapse:collapse;margin:4px 0 8px;font-size:11.5px}
  .gdt th,.gdt td{border:1px solid #232b38;padding:4px 8px;text-align:left}
  .gdt th{background:#151c27;color:#c9d4e3;font-weight:600}
  .gdt td{color:#a9b5c6;font-family:ui-monospace,Menlo,monospace}
  .gd-warn{color:#f0a45a !important}
  .gd-warn-p{color:#d9b48a !important;border-left:2px solid #7a4a1e;padding-left:9px}

  mark.hl{background:#1b2c48;color:#a8c8ff;padding:0 5px;border-radius:4px;font-weight:600}
  mark.hl-warn{background:#3a2110;color:#f0b070;padding:0 5px;border-radius:4px;font-weight:600}

  /* 头部按钮：去掉点击后残留的蓝色焦点块 */
  header button{background:#171d27;border:1px solid #232b38;color:#c9d4e3}
  header button:hover{background:#1d2431;border-color:#33405a;color:#e6ecf6}
  header button:focus{outline:none}
  header button:focus-visible{outline:2px solid #2f4d73;outline-offset:1px}

  .dlg.wide{max-height:78vh;overflow:hidden}
  .dlg.wide .gscroll{flex:1;min-height:0;overflow:auto;padding-right:8px}
  .dlg.wide h3{flex:none}
  .dlg.wide .foot{flex:none;margin-top:10px}

  /* ================= 质感与层次 ================= */
  body{background:
    radial-gradient(1200px 520px at 50% -12%, #16233a 0%, rgba(22,35,58,0) 62%),
    linear-gradient(180deg,#0a0d13 0%,#0b0f16 100%);}
  header{background:linear-gradient(180deg,#141a24,#0f141c);
    box-shadow:0 1px 0 #1e2635, 0 8px 24px -18px #000;}
  aside{background:linear-gradient(180deg,#101620,#0d1219);box-shadow:inset -1px 0 0 #1c2330;}

  button{background:linear-gradient(180deg,#1b222e,#141a24);border:1px solid #2a3444;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 1px 2px rgba(0,0,0,.5);}
  button:hover{background:linear-gradient(180deg,#232c3a,#18202b);border-color:#3a4760}
  button:active{background:#141a24;box-shadow:inset 0 2px 5px rgba(0,0,0,.65)}
  button.primary{background:linear-gradient(180deg,#5fa2ff,#3a7fe0);border-color:#4b8ded;color:#04101f;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 2px 10px -2px rgba(95,162,255,.55)}
  button.primary:hover{background:linear-gradient(180deg,#70adff,#4287ea)}
  button.danger{background:linear-gradient(180deg,#e05762,#bd3944);border-color:#c94450;color:#fff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 2px 10px -3px rgba(224,87,98,.5)}
  button.danger:hover{background:linear-gradient(180deg,#ea646f,#c64450)}
  button.accent{background:linear-gradient(180deg,#2b5fa8,#1e4a86);border-color:#3a6cb5;color:#dce9ff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 1px 3px rgba(0,0,0,.45)}
  button.accent:hover{background:linear-gradient(180deg,#356fbf,#245699);border-color:#4a80c9;color:#eaf3ff}

  .node:hover{background:linear-gradient(180deg,#1a212c,#151b25)}
  .node.sel{background:linear-gradient(180deg,#1b2c46,#16233a);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07), inset 2px 0 0 var(--acc)}
  .node .ico{box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 1px 2px rgba(0,0,0,.5)}

  .search input{background:#0a0e15;box-shadow:inset 0 1px 4px rgba(0,0,0,.6)}
  .search input:focus{box-shadow:inset 0 1px 4px rgba(0,0,0,.6), 0 0 0 2px rgba(95,162,255,.25)}

  .ed{background:#090c11;border:1px solid #1d2530;
    box-shadow:inset 0 2px 12px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.03)}
  .res{background:#0a0e14;border:1px solid #1d2530;box-shadow:inset 0 2px 10px rgba(0,0,0,.5)}
  .rhead{background:linear-gradient(180deg,#121821,#0e131a);box-shadow:0 1px 0 #1c2431}

  .dlg{background:linear-gradient(180deg,#161c27,#10151d);
    box-shadow:0 30px 90px -24px #000, inset 0 1px 0 rgba(255,255,255,.07)}
  .mask{background:radial-gradient(900px 500px at 50% 40%, rgba(10,14,22,.72), rgba(4,6,10,.88))}

  .toast{background:linear-gradient(180deg,#1d2531,#151b25);box-shadow:0 8px 24px -10px #000}
  .badge{box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}

  .niuma{display:flex;align-items:center;gap:9px;margin:6px 9px 11px;padding:7px 10px;border-radius:9px;
    background:linear-gradient(180deg,#151b26,#101620);border:1px solid #222b39;cursor:pointer;
    user-select:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 2px 6px -4px #000;transition:.15s}
  .niuma:hover{border-color:#35425a;transform:translateY(-1px)}
  .niuma:active{transform:translateY(0)}
  .nm-ico{font-size:17px;line-height:1;display:inline-block;animation:nmbob 1.5s ease-in-out infinite}
  .nm-txt{font-size:11px;color:#6f7b8e;font-family:ui-monospace,Menlo,monospace}
  .niuma.paused .nm-ico{animation:none;filter:grayscale(1) opacity(.55)}

  .niuma{display:flex;align-items:center;gap:9px;margin:8px 9px 11px;padding:8px 10px;border-radius:9px;

  .nm-col{display:flex;flex-direction:column;line-height:1.3;min-width:0}
  .nm-txt{font-size:11px;color:#7c8798}

  /* ================= 字体与按钮可读性 ================= */
  .dot{width:5px;height:5px;border-radius:50%;flex:none;background:#3a4452;box-shadow:none}
  .dot.ok{background:#3fb950;box-shadow:0 0 0 2px rgba(63,185,80,.14)}

    border-radius:5px;border:1px solid #2a3444;background:#1b2230;color:#9aa6b8;
    font-size:12px;line-height:1;transition:.12s}

  /* 悬停时按钮浮在右侧，不再挤压文字 */
  .node{position:relative}

    position:absolute;right:5px;top:0;bottom:0;display:flex;align-items:center;gap:3px;
    padding-left:16px;opacity:0;pointer-events:none;transition:opacity .12s;

  .node:hover .acts{opacity:1;pointer-events:auto}

  /* 悬停时把行数/库名往左让一点，避免被按钮压住 */
  .node:hover .sub{opacity:0}

<div class="mask" id="mask"><div class="dlg" id="dlg"></div></div>

<script>
const $ = id => document.getElementById(id);
let CUR = null, dirty = false, fmtPrev = null, openState = {}, CUR_PRE = true, EDIT_MODE = false, CUR_ENV = 'prod';
let PREVIEWS = [];
let LOGS = [], logFilter = { ok: '', dry: '' };
let PREFLIGHT_ON = true;

const RES_ACTIONS = '<span class="sp"></span>'
  + '<button class="sm" onclick="toggleResBig()" title="放大 / 还原结果区">⤢</button>'
  + '<button class="sm" onclick="copyRes()">复制</button>';

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function api(p, o, timeoutMs) {
  o = o || {};
  const ms = (timeoutMs === undefined) ? 60000 : timeoutMs;
  const ctrl = new AbortController();
  const timer = ms > 0 ? setTimeout(() => ctrl.abort(), ms) : null;
  let r;
  try {
    r = await fetch(p, Object.assign({}, o, { signal: ctrl.signal }));
  } catch (e) {
    clearTimeout(timer);
    if (e && e.name === 'AbortError') throw new Error('请求超时（' + Math.round(ms / 1000) + ' 秒无响应）：数据库可能连不上，或查询超过了数据源里设置的 DQL 超时');
    throw new Error('无法连接本地服务：程序可能已经退出');
  }
  if (timer) clearTimeout(timer);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
const post = (p, body) => api(p, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
// 长任务：不设前端超时，交给服务端的数据源超时控制
const postLong = (p, body) => api(p, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }, 0);
const del = p => api(p, { method: 'DELETE' });

function toast(t, kind = '') {
  const el = $('toast');
  el.textContent = t; el.className = 'toast on ' + kind;
  clearTimeout(el._t); el._t = setTimeout(() => el.className = 'toast ' + kind, 3200);
}

/* ================= 编辑器高亮 ================= */
const KW = new Set(('SELECT FROM WHERE UPDATE SET INSERT INTO VALUES DELETE JOIN LEFT RIGHT INNER OUTER CROSS ON AND OR NOT NULL IS IN LIKE BETWEEN AS GROUP BY ORDER LIMIT OFFSET DISTINCT CREATE TABLE ALTER DROP TRUNCATE BEGIN COMMIT ROLLBACK START TRANSACTION CASE WHEN THEN ELSE END UNION ALL EXISTS INTERVAL DAY HOUR MINUTE SECOND SHOW DATABASES EXPLAIN DESCRIBE DESC ASC HAVING WITH DUPLICATE KEY IGNORE REPLACE').split(' '));
const FN = new Set(('COUNT SUM MAX MIN AVG NOW DATE_SUB DATE_ADD DATEDIFF TIMESTAMPDIFF CONCAT CONCAT_WS IFNULL IFNULL IF COALESCE SUBSTRING SUBSTR REPLACE TRIM LTRIM RTRIM CAST CONVERT GROUP_CONCAT CURDATE CURTIME CURRENT_DATE CURRENT_TIMESTAMP UNIX_TIMESTAMP FROM_UNIXTIME ABS ROUND CEIL FLOOR LENGTH CHAR_LENGTH UPPER LOWER LPAD RPAD DATE FORMAT STR_TO_DATE LAST_DAY').split(' '));

function highlight(src) {
  const re = /(--[^\n]*|\/\*[\s\S]*?\*\/)|('(?:''|[^'])*'|"(?:[^"\n])*"|`(?:[^`])*`)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    if (m[1]) out += `<span class="c">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="s">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="n">${esc(m[3])}</span>`;
    else {
      const w = m[4], up = w.toUpperCase();
      out += KW.has(up) ? `<span class="k">${esc(w)}</span>` : (FN.has(up) ? `<span class="f">${esc(w)}</span>` : esc(w));
    }
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

function paint() {
  const ta = $('sql'), src = ta.value;
  $('hl').innerHTML = highlight(src) + '\n';
  const n = src.split('\n').length;
  let g = '';
  for (let i = 1; i <= n; i++) g += i + '\n';
  $('ln').style.whiteSpace = 'pre';
  $('ln').textContent = g;
  syncScroll();
}

// 行号栏：折行模式下按每条逻辑语句实际占用的高度排布，保证编号对得上
function renderGutter(src) {
  const ta = $('sql'), ln = $('ln');
  const lines = src.split('\n');
  if (!document.body.classList.contains('wrap')) {
    ln.style.whiteSpace = 'pre';
    ln.innerHTML = lines.map((_, i) => i + 1).join('\n');
    return;
  }
  const cs = getComputedStyle(ta);
  const width = ta.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  if (width <= 0) return;

  let mirror = document.getElementById('measure');
  if (!mirror) {
    mirror = document.createElement('div');
    mirror.id = 'measure';
    document.body.appendChild(mirror);
  }
  mirror.style.cssText = 'position:absolute;left:-99999px;top:0;visibility:hidden;box-sizing:content-box;white-space:pre-wrap;overflow-wrap:anywhere;';
  mirror.style.font = cs.font;
  mirror.style.lineHeight = cs.lineHeight;
  mirror.style.width = width + 'px';
  mirror.innerHTML = '';
  for (let i = 0; i < lines.length; i++) {
    const d = document.createElement('div');
    d.textContent = lines[i] || ' ';
    mirror.appendChild(d);
  }

  const lh = parseFloat(getComputedStyle(ln).lineHeight) || parseFloat(cs.lineHeight) || 24;
  let html = '';
  for (let i = 0; i < mirror.children.length; i++) {
    const h = Math.max(lh, mirror.children[i].getBoundingClientRect().height);
    html += '<div class="gl" style="height:' + h + 'px;line-height:' + lh + 'px">' + (i + 1) + '</div>';
  }
  ln.style.whiteSpace = 'normal';
  ln.innerHTML = html;
}
function syncScroll() {
  const ta = $('sql');
  $('hl').scrollTop = ta.scrollTop; $('hl').scrollLeft = ta.scrollLeft;
  $('ln').scrollTop = ta.scrollTop;
}

/* ================= 弹窗 ================= */
function dialog({ title, fields, okText = '保存', onDelete, extraLabel, onExtra, wide }) {
  return new Promise(resolve => {
    const body = fields.map(f => {
      if (f.type === 'db') {
        return `<label>${f.label}</label>
          <input id="f_${f.k}" value="${f.value == null ? '' : esc(f.value)}" placeholder="${f.placeholder || ''}" autocomplete="off">
          <div class="dblistBox" id="dblistBox"></div>`;
      }
      if (f.type === 'select') {
        return `<label>${f.label}</label>
          <select id="f_${f.k}">${(f.options || []).map(o =>
            `<option value="${o.v}" ${o.v === f.value ? 'selected' : ''}>${esc(o.t)}</option>`).join('')}</select>`;
      }
      return `<label>${f.label}</label>
        <input id="f_${f.k}" type="${f.type || 'text'}" value="${f.value == null ? '' : esc(f.value)}" placeholder="${f.placeholder || ''}">`;
    }).join('');

    const dlg = $('dlg');
    dlg.className = 'dlg' + (wide ? ' wide' : '');
    dlg.innerHTML = `<h3>${esc(title)}</h3>${body}
      <div id="dlgMsg" style="font-size:11.5px;margin-top:9px;min-height:15px;line-height:1.45"></div>
      <div class="foot">
        ${onDelete ? '<button class="danger" id="dlgDel">删除</button>' : ''}
        ${extraLabel ? `<button id="dlgExtra">${extraLabel}</button>` : ''}
        <span class="l"></span>
        <button id="dlgCancel">取消</button>
        <button class="primary" id="dlgOk">${okText}</button>
      </div>`;
    $('mask').classList.add('on');
    const inputs = [...dlg.querySelectorAll('input,select')];
    if (inputs[0]) setTimeout(() => inputs[0].focus(), 30);

    const read = () => { const o = {}; fields.forEach(f => o[f.k] = $('f_' + f.k).value); return o; };
    const close = v => { $('mask').classList.remove('on'); resolve(v); };

    $('dlgOk').onclick = () => close(read());
    $('dlgCancel').onclick = () => close(null);
    if (onDelete) $('dlgDel').onclick = () => { if (confirm('确认删除？不可恢复')) close({ __delete: true }); };
    if (extraLabel && onExtra) $('dlgExtra').onclick = async () => {
      const box = $('dlgMsg');
      box.textContent = '连接中…'; box.style.color = 'var(--dim)';
      try {
        const r = await onExtra(read());
        box.textContent = (r.ok ? '✔ ' : '✘ ') + (r.ok ? r.output + (r.databases && r.databases.length ? `　·　共 ${r.databases.length} 个库，点下方库名选择` : '') : r.error);
        box.style.color = r.ok ? 'var(--ok)' : 'var(--bad)';
        if (r.ok && r.databases && r.databases.length) {
          const box = $('dblistBox');
          if (box) {
            box.innerHTML = r.databases.map(d =>
              `<span class="dbchip" data-v="${esc(d)}">${esc(d)}</span>`).join('');
            box.querySelectorAll('.dbchip').forEach(el => {
              el.onclick = () => {
                const inp = $('f_database');
                if (inp) { inp.value = el.getAttribute('data-v'); inp.focus(); }
              };
            });
          }
          // 只有一个库时直接填好，省得再选
          if (r.databases.length === 1) {
            const inp = $('f_database');
            if (inp && !inp.value) inp.value = r.databases[0];
          }
        }
      } catch (e) { box.textContent = '✘ ' + e.message; box.style.color = 'var(--bad)'; }
    };

    /* 回车：中间字段跳到下一栏，最后一栏才提交；Esc 取消 */
    dlg.onkeydown = e => {
      if (e.key === 'Escape') { close(null); return; }
      if (e.key !== 'Enter') return;
      const idx = inputs.indexOf(document.activeElement);
      if (idx >= 0 && idx < inputs.length - 1) { e.preventDefault(); inputs[idx + 1].focus(); return; }
      e.preventDefault(); $('dlgOk').click();
    };
  });
}

/* ================= 树 ================= */
let DS = [], FOLDERS = [], ROOT_SCRIPTS = [], DEFAULTS = {};
let IDX = { g: {}, s: {} };

async function loadTree(noCheck) {
  const r = await api('/api/tree');
  DS = r.datasources || [];
  FOLDERS = r.folders || [];
  ROOT_SCRIPTS = r.rootScripts || [];
  DEFAULTS = r.defaults || {};
  indexTree();
  renderTree();
  updateHealth();
  if (!noCheck) checkAllDs();
}

function indexTree() {
  IDX = { g: {}, s: {} };
  const walk = (nodes, path, top) => {
    for (const g of nodes || []) {
      const isTop = !top;
      IDX.g[g.id] = {
        id: g.id, name: g.name, path: path.concat(g.name), isTop,
        topId: isTop ? g.id : top.id,
        dsId: isTop ? (g.dsId || '') : (top.dsId || ''),
        dsName: isTop ? (g.dsName || '') : (top.dsName || ''),
        preflight: isTop ? !!g.preflight : !!top.preflight,
        versionCol: isTop ? (g.versionCol || '') : (top.versionCol || ''),
        versionPrefixes: isTop ? (g.versionPrefixes || '') : (top.versionPrefixes || '')
      };
      for (const sc of g.scripts || []) {
        IDX.s[sc.id] = {
          id: sc.id, name: sc.name, lines: sc.lines, groupId: g.id,
          path: path.concat(g.name, sc.name),
          folderName: (isTop ? g.name : top.name),
          ownPreflight: (sc.preflight === undefined ? null : sc.preflight),
          ownVersionCol: sc.versionCol || '',
          ownVersionPrefixes: sc.versionPrefixes || ''
        };
      }
      walk(g.folders, path.concat(g.name), isTop ? g : top);
    }
  };
  walk(FOLDERS, [], null);
  for (const sc of ROOT_SCRIPTS) {
    IDX.s[sc.id] = {
      id: sc.id, name: sc.name, lines: sc.lines, groupId: '', path: [sc.name],
      dsId: sc.dsId || '', dsName: sc.dsName || '',
      preflight: !!sc.preflight, versionCol: sc.versionCol || '', versionPrefixes: sc.versionPrefixes || ''
    };
  }
}

let DS_HEALTH = {};   // id -> 'ok' | 'fail' | undefined

async function checkDs(id, silent) {
  try {
    const r = await postLong('/api/ds/test', { id });
    DS_HEALTH[id] = r.ok ? 'ok' : 'fail';
    if (!silent) {
      toast(r.ok ? ('连接正常 · ' + r.output) : ('连接失败 · ' + (r.error || '')), r.ok ? 'ok' : 'bad');
    }
  } catch (e) {
    DS_HEALTH[id] = 'fail';
    if (!silent) toast(e.message, 'bad');
  }
  renderTree();
  updateHealth();
}

function checkAllDs() { DS.forEach(function (d) { checkDs(d.id, true); }); }

function overallHealth() {
  if (!DS.length) return 'unknown';
  var ok = 0, fail = 0, unknown = 0;
  for (var i = 0; i < DS.length; i++) {
    var h = DS_HEALTH[DS[i].id];
    if (h === 'ok') ok++;
    else if (h === 'fail') fail++;
    else unknown++;
  }
  if (unknown > 0) return 'unknown';
  if (fail === 0) return 'ok';
  return ok === 0 ? 'fail' : 'partial';
}

function healthTip() {
  var lines = [DS.length + ' 个连接'];
  for (var i = 0; i < DS.length; i++) {
    var d = DS[i], h = DS_HEALTH[d.id];
    var tag = h === 'ok' ? '正常' : h === 'fail' ? '失败' : '未检测';
    lines.push('  ' + d.name + '：' + tag);
  }
  return lines.join('\n');
}

function updateHealth() {
  var h = overallHealth();
  var scope = LISTEN_MODE === 'all' ? '局域网' : '本机';
  var label = scope + ' · ' + DS.length + ' 个连接 · ' + Object.keys(IDX.s).length + ' 个脚本';
  $('who').innerHTML = '<span class="hb ' + (h === 'fail' ? 'bad' : 'ok') + '"></span>' + label;
  $('who').title = (LISTEN_MODE === 'all' ? '当前允许局域网访问' : '当前仅本机可访问') + '\n' + healthTip();
  $('who').title = healthTip();
}

function actCheckDs(key) { checkDs(key.slice(1), false); }

async function actMove(arg) {
  const parts = String(arg).split('|');
  const key = parts[0];
  const dir = parts[1] === 'up' ? -1 : 1;
  const kind = key[0] === 'g' ? 'group' : 'script';
  try {
    const r = await post('/api/order', { kind: kind, id: key.slice(1), dir: dir });
    if (r.ok) await loadTree(true);
    else toast('已经到顶/到底了', 'bad');
  } catch (e) { toast(e.message, 'bad'); }
}

function toggleNiuma() {
  const el = $('niuma');
  const paused = el.classList.toggle('paused');
  $('nmIco').textContent = paused ? '💤' : '🐮';
  $('nmTxt').textContent = paused ? '歇一会儿' : '今天也在努力营业';
  $('nmSub').textContent = paused ? '（摸鱼中）' : '这个需求很简单';
  el.title = paused ? '点一下，继续搬砖' : '点一下，歇一会儿';
  try { localStorage.setItem('niuma_paused', paused ? '1' : '0'); } catch (e) {}
}

function toggleSection(k) { openState[k] = openState[k] === false; renderTree(); }

function subtreeMatch(g, q) {
  if (!q) return true;
  if ((g.scripts || []).some(x => x.name.toLowerCase().includes(q))) return true;
  return (g.folders || []).some(x => subtreeMatch(x, q));
}

let TREE_TIMER = null;
function queueTree() {
  clearTimeout(TREE_TIMER);
  TREE_TIMER = setTimeout(renderTree, 150);
}

function renderTree() {
  const q = ($('q').value || '').toLowerCase().trim();
  const dsOpen = openState['ds'] !== false;
  let h = '';

  h += `<div class="sect" onclick="toggleSection('ds')">
      <span class="chev ${dsOpen ? 'open' : ''}">▶</span><span class="dot ${overallHealth()}"></span>数据源
      <span class="n">${DS.length}</span>
      <button class="add" data-act="editDs" data-arg="" title="新建数据源" data-tip="新建数据源">＋</button>
    </div>`;
  if (dsOpen) {
    if (!DS.length) h += `<div class="empty">还没有连接。<br>点右上「＋」新建一个。</div>`;
    for (const d of DS) {
      const envTxt = d.env === 'test' ? '测试' : '生产';
      const st = DS_HEALTH[d.id] === 'ok' ? '正常' : DS_HEALTH[d.id] === 'fail' ? '失败' : '未检测';
      const tip = `${d.name}（${envTxt}）\n${d.user}@${d.host}:${d.port}/${d.database || ''}\n状态：${st}`;
      h += `<div class="node" data-key="d${d.id}" title="${esc(tip)}" style="padding-left:16px">
        <span class="ico">${iconFor('d')}</span>
        <span class="dot ${DS_HEALTH[d.id] === 'ok' ? 'ok' : DS_HEALTH[d.id] === 'fail' ? 'fail' : ''}"></span>
        <span class="lbl">${esc(d.name)}</span>
        <span class="badge ${d.env === 'test' ? 'test' : 'prod'}">${d.env === 'test' ? '测试' : '生产'}</span>
        <span class="acts">
          <button data-act="actCheckDs" data-arg="d${d.id}" title="检测连接 / 重连" data-tip="检测连接 / 重连">⟳</button>
          <button data-act="actAddGroup" data-arg="d${d.id}" title="新建顶层文件夹" data-tip="新建顶层文件夹">＋</button>
          <button data-act="actAddRootScript" data-arg="d${d.id}" title="新建单层脚本" data-tip="新建单层脚本（直接挂这个连接）">✚</button>
          <button data-act="editDs" data-arg="d${d.id}" title="编辑连接" data-tip="编辑连接">✎</button>

        </span>
      </div>`;
    }
    h += `<div style="height:4px"></div>`;
  }

  h += `<div class="sect" style="cursor:default"><span style="width:11px"></span><span class="dot gray"></span>脚本<span class="n">${Object.keys(IDX.s).length}</span></div>`;
  h += foldersHTML(FOLDERS, 0, q);
  for (const sc of ROOT_SCRIPTS) {
    if (q && !sc.name.toLowerCase().includes(q)) continue;
    h += row({ key: 's' + sc.id, depth: 0, ico: '📄', label: sc.name, sub: sc.lines + ' 行',
      badge: sc.dsName || '未挂库', sel: CUR === sc.id,
      acts: [['↑', 'actMove', 's' + sc.id + '|up', '上移'],
             ['↓', 'actMove', 's' + sc.id + '|down', '下移'],
             ['⚙', 'scriptSettings', 's' + sc.id, '脚本设置：数据源 / 预检 / 版本'],
             ['✎', 'editScript', 's' + sc.id, '重命名'],
             ['✕', 'delScript', 's' + sc.id, '删除脚本']] });
  }
  if (!FOLDERS.length && !ROOT_SCRIPTS.length) {
    h += `<div class="empty">还没有文件夹。<br>在上面的数据源右侧点 ＋ 新建。</div>`;
  }

  $('tree').innerHTML = h;
  bindTree();
}

function foldersHTML(nodes, depth, q) {
  let h = '';
  for (const g of nodes || []) {
    if (!subtreeMatch(g, q)) continue;
    const key = 'g' + g.id;
    const open = openState[key] !== false;
    const isTop = g.dsId !== undefined;
    const kids = (g.folders || []).length + (g.scripts || []).length;
    const acts = [
      ['↑', 'actMove', key + '|up', '上移'],
      ['↓', 'actMove', key + '|down', '下移'],
      ['＋', 'actAddGroup', key, '新建子文件夹'],
      ['✚', 'actAddScript', key, '新建脚本']
    ];
    if (isTop) acts.push(['⚙', 'folderSettings', key, '文件夹设置：数据源 / 预检 / 版本']);
    acts.push(['✎', 'editGroup', key, '重命名'], ['✕', 'delGroup', key, '删除文件夹']);

    h += row({
      key, depth: depth + 1, chev: kids > 0, open, ico: '📁', label: g.name,
      sub: (g.scripts || []).length + ' 项',
      badge: '',
      envBadge: '',
      tip: isTop ? (g.name + '\n连接：' + (g.dsName || '未绑定') + (g.dsEnv ? '（' + (g.dsEnv === 'test' ? '测试' : '生产') + '）' : '')) : (g.name + '\n继承上级文件夹'),
      acts
    });
    if (!open) continue;
    h += foldersHTML(g.folders, depth + 1, q);
    for (const sc of g.scripts || []) {
      if (q && !sc.name.toLowerCase().includes(q)) continue;
      h += row({ key: 's' + sc.id, depth: depth + 2, ico: '📄', label: sc.name, sub: sc.lines + ' 行', sel: CUR === sc.id,
        tip: sc.name + '\n' + (g.dsEnv ? (g.dsEnv === 'test' ? '测试库' : '生产库') : '') + ' · 继承文件夹设置',
        acts: [['↑', 'actMove', 's' + sc.id + '|up', '上移'],
               ['↓', 'actMove', 's' + sc.id + '|down', '下移'],
               ['⚙', 'scriptSettings', 's' + sc.id, '脚本设置：预检 / 版本字段'],
               ['✎', 'editScript', 's' + sc.id, '重命名'],
               ['✕', 'delScript', 's' + sc.id, '删除脚本']] });
    }
  }
  return h;
}

function row({ key, depth, chev, open, ico, label, sub, badge, envBadge, tip, acts, sel }) {

function bindTree() {
  $('tree').querySelectorAll('.node').forEach(el => {
    el.onclick = e => {
      if (e.target.dataset.act) return;
      const key = el.dataset.key, t = key[0], id = key.slice(1);
      if (t === 'd') return;
      if (t === 'g') { openState[key] = openState[key] === false; renderTree(); }

  });
  $('tree').querySelectorAll('[data-act]').forEach(b => {

/* ================= 美化 ================= */
const CLAUSE = ['select', 'from', 'where', 'group by', 'order by', 'having', 'limit', 'offset', 'insert into', 'insert', 'update', 'delete from', 'delete', 'set', 'values', 'union all', 'union', 'left join', 'right join', 'inner join', 'outer join', 'join'];
const WORDY = new Set(('select from where group by order having limit offset insert into values update delete set join left right inner outer on as and or not null is in like between exists case when then else end distinct count sum max min avg asc desc union all create table alter drop truncate rename if primary key default begin commit rollback explain show databases describe').split(' '));

function formatSQL(text) {
  const out = [];
  let i = 0, depth = 0, lineStart = true;
  const push = s => { out.push(s); lineStart = false; };
  const newline = () => {
    while (out.length && /[ \t]$/.test(out[out.length - 1])) out[out.length - 1] = out[out.length - 1].replace(/[ \t]+$/, '');
    if (!lineStart) out.push('\n');
    lineStart = true;
  };
  while (i < text.length) {
    const c = text[i];
    if (c === '-' && text[i + 1] === '-') {
      let j = text.indexOf('\n', i); if (j < 0) j = text.length;
      newline(); push(text.slice(i, j).trimEnd()); newline(); i = j + 1; continue;
    }
    if (c === '/' && text[i + 1] === '*') {
      let j = text.indexOf('*/', i + 2); j = j < 0 ? text.length : j + 2;
      newline(); push(text.slice(i, j)); newline(); i = j; continue;
    }
    if (c === "'" || c === '"' || c === '`') {
      const q = c; let j = i + 1;
      while (j < text.length) {
        if (text[j] === '\\') { j += 2; continue; }
        if (text[j] === q) { if (text[j + 1] === q) { j += 2; continue; } j++; break; }
        j++;
      }
      push(text.slice(i, j)); i = j; continue;
    }
    if (c === '(') { depth++; push(c); i++; continue; }
    if (c === ')') { depth = Math.max(0, depth - 1); push(c); i++; continue; }
    if (c === ';') { push(';'); newline(); i++; while (text[i] === '\n') i++; out.push('\n'); continue; }
    if (/\s/.test(c)) { if (c === '\n') newline(); else if (!lineStart) push(' '); i++; continue; }
    const m = /^[A-Za-z_][A-Za-z0-9_$]*/.exec(text.slice(i));
    if (!m) { push(c); i++; continue; }
    let word = m[0], j = i + word.length;
    const two = /^[ \t\n]+([A-Za-z]+)/.exec(text.slice(j));
    let phrase = word.toLowerCase();
    if (two && ['group', 'order', 'union', 'left', 'right', 'inner', 'outer', 'insert', 'delete'].includes(phrase)) {
      const cand = phrase + ' ' + two[1].toLowerCase();
      if (CLAUSE.includes(cand)) { word = word + ' ' + two[1]; j += two[0].length; phrase = cand; }
    }
    const atTop = depth === 0;
    if (atTop && CLAUSE.includes(phrase) && out.length) newline();
    if (atTop && (phrase === 'and' || phrase === 'or') && out.length) { newline(); push('  '); }
    push(WORDY.has(phrase) ? word.toUpperCase() : word);
    i = j;
  }
  return out.join('').replace(/\n{3,}/g, '\n\n').replace(/[ \t]+\n/g, '\n').trim() + '\n';
}
function formatNow() {
  const ta = $('sql');
  fmtPrev = ta.value;
  ta.value = formatSQL(ta.value);
  paint(); dirty = true;
  $('btnUnfmt').style.display = '';
  toast('已美化（可点「还原」退回）', 'ok');
}
function undoFormat() {
  if (fmtPrev == null) return;
  $('sql').value = fmtPrev; paint(); fmtPrev = null; dirty = true;
  $('btnUnfmt').style.display = 'none';
}

/* ================= 校验 / 预演 / 执行 ================= */
async function preflight(silent) {
  if (!CUR) { if (!silent) toast('先选一个脚本', 'bad'); return null; }
  if (!silent) showBusy('数据预检中…');
  const info = currentSqlInfo();
  if (!info.text.trim()) { if (!silent) toast('没有 SQL', 'bad'); return null; }
  try {
    const r = await postLong('/api/preflight', { scriptId: CUR, sql: info.text });
    r.selOnly = info.selOnly;
    if (!silent) safeRender(() => renderPreflight(r));
    return r;
  } catch (e) {
    if (!silent) { showErr(e.message); toast(e.message, 'bad'); }
    return null;
  }
}

function versionsHTML(versions) {
  if (!versions || !versions.length) return '';
  let h = `<div class="vblock"><div class="vtitle">本次数据版本</div>`;
  for (const v of versions) {
    if (v.missing) {
      h += `<div class="vrow"><span class="vt">${esc(v.table)}</span><span class="vt">无 ${esc(v.field)} 字段</span></div>`;
      continue;
    }
    if (v.note) {
      h += `<div class="vrow"><span class="vt">${esc(v.table)}</span><span class="vt">${esc(v.note)}</span></div>`;
    }
    const ok = (v.ok || []).map(x => `<span class="vtag">${esc(x)}</span>`).join('');
    const bad = (v.other || []).map(x => `<span class="vtag bad">${esc(x)}</span>`).join('');
    h += `<div class="vrow"><span class="vt">${esc(v.table)}</span><span>${ok}${bad}</span></div>`;
  }
  return h + `</div>`;
}

function confirmDialog(title, bodyHTML, okText) {
  return new Promise(resolve => {
    const dlg = $('dlg');
    dlg.className = 'dlg';
    dlg.innerHTML = `<h3>${esc(title)}</h3>${bodyHTML}
      <div class="foot"><span class="l"></span>
        <button id="cCancel">取消</button>
        <button class="primary" id="cOk">${esc(okText || '执行')}</button></div>`;
    $('mask').classList.add('on');
    const close = v => { $('mask').classList.remove('on'); resolve(v); };
    $('cOk').onclick = () => close(true);
    $('cCancel').onclick = () => close(false);
    dlg.onkeydown = e => { if (e.key === 'Escape') close(false); };
    setTimeout(() => $('cCancel').focus(), 30);
  });
}

function checkRowHTML(c) {
  const color = c.level === 'error' ? '#ff9a9a' : c.level === 'warn' ? '#f0c070' : '#7ee2a0';
  const label = c.level === 'error' ? '错误' : c.level === 'warn' ? '提醒' : '通过';
  const go = (c.stmt != null && c.stmt >= 0)
    ? `<span class="go" onclick="event.stopPropagation();jumpToStmt(${c.stmt})" title="跳到这条 SQL">跳到 SQL ↗</span>`
    : '';
  const st = (c.stmt != null && c.stmt >= 0) ? c.stmt : -1;
  return `<div class="chk" data-level="${c.level}" data-jump="${st}" onclick="clickCheck(this, ${st})" style="cursor:pointer">
    <span class="chk-t">${esc(c.title || '')}</span>
    ${detailHTML(c)}
    ${go}
    <span class="chk-s" style="color:${color}">${label}</span>
  </div>`;
}

let LAST_CHECKS = [];

function renderPreflight(r) {
  const checks = r.checks || [];
  LAST_CHECKS = checks;
  const errs = checks.filter(c => c.level === 'error').length;
  const warns = checks.filter(c => c.level === 'warn').length;
  const global = checks.filter(c => (c.stmt == null ? 0 : c.stmt) < 0);
  const byStmt = {};
  for (const c of checks) {
    const i = c.stmt == null ? 0 : c.stmt;
    if (i < 0) continue;
    (byStmt[i] = byStmt[i] || []).push(c);
  }

  let html = `<div class="rhead">
    <span class="badge ${errs ? 'bad' : warns ? 'warn' : 'ok'}">${errs ? '有异常' : warns ? '有提醒' : '预检通过'}</span>
    <span class="chip">数据预检</span>
    <span class="chip">${r.count || 0} 条语句</span>
    <span class="chip" title="预检耗时">${r.ms != null ? r.ms + ' ms' : '—'}</span>
    ${r.selOnly ? '<span class="chip" style="color:#e0a33a">仅选中部分</span>' : ''}
    ${errs ? `<span class="chip clickable" style="color:#ff9a9a" onclick="jumpToFirst('error')" title="跳到第一个错误">${errs} 个错误 ↗</span>` : ''}
    ${warns ? `<span class="chip clickable" style="color:#e0a33a" onclick="jumpToFirst('warn')" title="跳到第一个提醒">${warns} 个提醒 ↗</span>` : ''}
    ${RES_ACTIONS}
  </div>`;

  if (r.error) html += `<div class="errbox">${esc(r.error)}</div>`;
  html += versionsHTML(r.versions);

  const idxs = Object.keys(byStmt).map(Number).sort((a, b) => a - b);
  if (!idxs.length && !global.length) {
    html += `<div class="note">没有可检查的 DML（支持 INSERT ... SELECT 和多表 UPDATE）。</div>`;
  }
  PREVIEWS = r.previews || [];
  for (const i of idxs) {
    const cs = byStmt[i];
    const e2 = cs.filter(c => c.level === 'error').length;
    const lvl = e2 ? 'err' : (cs.some(c => c.level === 'warn') ? 'warn' : 'ok');
    let body = '';
    const pv = PREVIEWS[i];
    if (pv) body += `<div class="sqlprev">${esc(pv)}</div>`;
    for (const c of cs) body += checkRowHTML(c);
    html += blockHTML(i, lvl, '语句 ' + (i + 1), stmtSummary(cs), body);
  }
  if (global.length) {
    const e2 = global.filter(c => c.level === 'error').length;
    const lvl = e2 ? 'err' : (global.some(c => c.level === 'warn') ? 'warn' : 'ok');
    let body = '';
    for (const c of global) body += checkRowHTML(c);
    html += blockHTML(-1, lvl, '全局', stmtSummary(global), body);
  }

  $('res').innerHTML = html;
  $('res').scrollTop = 0;
  bindStmtJump();
}

async function check() {
  if (!CUR) return;
  const text = currentSql();
  if (!text.trim()) return toast('没有可校验的 SQL', 'bad');
  showBusy('语法校验中（EXPLAIN，不改数据）…');
  try {
    const r = await postLong('/api/check', { scriptId: CUR, sql: text });
    safeRender(() => renderCheck(r));
    toast(r.ok ? '语法校验通过' : '语法校验发现问题', r.ok ? 'ok' : 'bad');
  } catch (e) { showErr(e.message); toast(e.message, 'bad'); }
}
function renderCheck(r) {
  const list = r.results || [];
  const bad = list.filter(x => !x.ok).length;
  let html = `<div class="rhead">
    <span class="badge ${r.ok ? 'ok' : 'bad'}">${r.ok ? '通过' : '有问题'}</span>
    <span class="chip">语法校验 · EXPLAIN</span>
    <span class="chip">${r.count || list.length} 条语句</span>
    <span class="chip" title="校验耗时">${r.ms != null ? r.ms + ' ms' : '—'}</span>
    ${bad ? `<span class="chip" style="color:#ff9a9a">${bad} 条失败</span>` : ''}
    ${RES_ACTIONS}
  </div>`;
  html += `<div class="note">语法校验只读，不会修改数据；DDL 无法静态校验，会跳过。</div>`;
  PREVIEWS = r.previews || [];
  for (const x of list) {
    const p = PREVIEWS[x.i] || '';
    let body = p ? `<div class="sqlprev">${esc(p)}</div>` : '';
    if (!x.ok) body += `<div class="errbox">${esc(x.error || '')}</div>`;
    const sum = x.ok ? (x.skipped ? '跳过（DDL）' : '语法通过') : '语法错误';
    html += blockHTML(x.i, x.ok ? 'ok' : 'err', '语句 ' + (x.i + 1), sum, body);
  }
  $('res').innerHTML = html;
  $('res').scrollTop = 0;
  bindStmtJump();
}

async function run(dryRun) {
  if (!CUR) return;
  const info = currentSqlInfo();
  const text = info.text;
  const sel = info.selOnly ? text : '';
  if (!text.trim()) return toast('没有可执行的 SQL', 'bad');
  // 执行前自动数据预检（可在「设置」里关掉）
  let pf = null;
  if (CUR_PRE) {
    showBusy('预检中…');
    pf = await preflight(true);
    if (pf && !pf.ok) {
      safeRender(() => renderPreflight(pf));
      toast('数据预检未通过，已中止', 'bad');
      return;
    }
  }
  const warnN = pf ? (pf.checks || []).filter(c => c.level === 'warn').length : 0;

  if (!dryRun) {
    const est = ((pf && pf.checks) || []).filter(c => c.title === '预计影响行数')
      .map(c => `第 ${c.stmt + 1} 条：${c.detail}`).join('<br>');
    const envBanner = (CUR_ENV === 'prod')
      ? '<div style="margin-bottom:10px;padding:8px 10px;border-radius:6px;background:#2a1216;border:1px solid #5d2a30;color:#ffb0b6;font-size:12px">⚠ 这是<b>生产库</b>，执行后立即生效，确认无误再继续。</div>'
      : '';
    const body = envBanner + versionsHTML((pf && pf.versions) || []) +
      `<div style="margin-top:12px;font-size:12px;color:#9aa6b8;line-height:1.8">
         目标：${esc($('crumb').textContent)}<br>
         ${sel ? '仅执行选中部分' : '执行全部'} · ${(pf && pf.count) || 0} 条语句
         ${est ? '<br><span style="color:#e0a33a">' + est + '</span>' : ''}
       </div>`;
    const okGo = await confirmDialog('确认执行', body, '执行');
    if (!okGo) { $('res').innerHTML = '<div class="rhead"><span class="chip">已取消</span></div>'; return; }
  }

  showBusy('执行中…');
  try {
    const r = await postLong('/api/run', { scriptId: CUR, sql: text, dryRun, versions: (pf && pf.versions) || [] });
    r.selOnly = info.selOnly;
    safeRender(() => renderRun(r, dryRun, warnN, (pf && pf.versions) || []));
    toast(r.ok ? '执行完成' : '执行失败，已回滚', r.ok ? 'ok' : 'bad');
  } catch (e) { showErr(e.message); toast(e.message, 'bad'); }
}
let BUSY_TIMER = null, BUSY_T0 = 0;

function showBusy(msg) {
  // 只建一次 DOM，之后只改秒数文本：
  // 每帧重绘 innerHTML 会重建转圈元素，CSS 动画从头播放，看起来像在抖。
  hideBusy();
  BUSY_T0 = Date.now();
  $('res').innerHTML = `<div class="busy">
    <div class="spin"></div>
    <div class="busyT">${esc(msg)}</div>
    <div class="busyS"><span class="busyNum">0.0</span> 秒 · 大表统计可能需要几分钟；超时会显示「未计算」</div>
  </div>`;
  const num = $('res').querySelector('.busyNum');
  const paint = () => {
    if (!num) return;
    num.textContent = ((Date.now() - BUSY_T0) / 1000).toFixed(1);
  };
  paint();
  BUSY_TIMER = setInterval(paint, 100);
}

function hideBusy() {
  if (BUSY_TIMER) { clearInterval(BUSY_TIMER); BUSY_TIMER = null; }
}
function showErr(msg) {
  $('res').innerHTML = `<div class="rhead"><span class="badge bad">失败</span></div><div class="errbox">${esc(msg)}</div>`;
}

function renderRun(r, dryRun, warnN, versions) {
  const results = r.results || {};
  const previews = r.previews || [];
  PREVIEWS = previews;
  const count = r.count || previews.length;
  const failedAt = (r.failedAt == null) ? -1 : r.failedAt;
  const ok = !!r.ok;

  let html = `<div class="rhead">
    <span class="badge ${ok ? 'ok' : 'bad'}">${ok ? '成功' : '失败'}</span>
    <span class="chip">${dryRun ? '预演（已回滚）' : '执行'}</span>
    <span class="chip">${count} 条语句</span>
    ${r.selOnly ? '<span class="chip" style="color:#e0a33a">仅选中部分</span>' : ''}
    <span class="chip">${r.ms || 0} ms</span>
    ${RES_ACTIONS}
  </div>`;

  if (versions && versions.length) {
    html += `<div style="padding:8px 10px;border-bottom:1px solid #161b24">${versionsHTML(versions)}</div>`;
  }
  if (warnN > 0) {
    html += `<div class="note">预检有 ${warnN} 个提醒（比如源表为空），已继续执行，可点「预检」查看明细。</div>`;
  }
  if (!ok && failedAt >= 0) {
    const after = Math.max(0, count - failedAt - 1);
    html += `<div class="note bad">第 ${failedAt + 1} 条执行失败 → 已停止；前面的 ${failedAt} 条改动全部回滚，后面 ${after} 条未执行。</div>`;
  }
  if (r.error) html += `<div class="errbox">${esc(r.error)}</div>`;

  let total = 0;
  for (let i = 0; i < count; i++) {
    const x = results[i];
    const failed = i === failedAt;
    const skipped = failedAt >= 0 && i > failedAt;
    let meta = '';
    if (failed) meta = '失败';
    else if (skipped) meta = '未执行';
    else if (x && x.columns) meta = `${(x.rows || []).length} 行` + (x.ms ? ` · ${x.ms}ms` : '');
    else if (x) { meta = `变更 ${x.affected || 0} 行` + (x.ms ? ` · ${x.ms}ms` : ''); total += x.affected || 0; }
    else meta = '—';

    let body = previews[i] ? `<div class="sqlprev">${esc(previews[i])}</div>` : '';
    if (x && x.columns && x.columns.length) body += tableHtml(x.columns, x.rows || []);
    if (failed && r.error) body += `<div class="errbox">${esc(r.error)}</div>`;
    const lvl = failed ? 'err' : (skipped ? 'warn' : 'ok');
    html += blockHTML(i, lvl, '语句 ' + (i + 1), meta, body);
  }
  $('res').innerHTML = html;
  $('res').scrollTop = 0;
  bindStmtJump();
}
function tableHtml(cols, rows) {
  const head = cols.map(c => `<th>${esc(c)}</th>`).join('');
  const body = rows.length
    ? rows.map(r => `<tr>${r.map(c => `<td>${c === null ? '<span style="color:#5b6577">NULL</span>' : esc(c)}</td>`).join('')}</tr>`).join('')
    : `<tr><td colspan="${cols.length}" style="color:#5b6577">无数据</td></tr>`;
  return `<table class="grid"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}
function copyRes() {
  const txt = $('res').innerText;
  navigator.clipboard.writeText(txt).then(() => toast('已复制', 'ok'), () => toast('复制失败', 'bad'));
}

/* ================= 设置 ================= */
// 点提醒 → 跳到编辑器对应语句
// 服务端预览把空白压成了单个空格，所以这里也用同样的压缩方式做匹配
function collapseWs(text) {
  let out = '', map = [], ws = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === ' ' || ch === '\t' || ch === '\n' || ch === '\r') { ws = true; continue; }
    if (ws && out) { out += ' '; map.push(i - 1); }
    ws = false;
    out += ch; map.push(i);
  }
  return { out: out, map: map };
}

function jumpToStmt(i) {
  const pv = (PREVIEWS[i] || '').trim();
  if (!pv) return;
  const ta = $('sql');
  const needle = pv.replace(/…$/, '').trim();
  let start = -1, end = -1;

  // 先按原文（含换行）精确匹配
  const direct = ta.value.indexOf(needle.slice(0, 60));
  if (direct >= 0) {
    start = direct;
    end = direct + Math.min(needle.length, ta.value.length - direct);
  } else {
    // 退回到忽略空白差异的匹配
    const c = collapseWs(ta.value);
    const flat = needle.replace(/\s+/g, ' ').slice(0, 40);
    const hit = c.out.indexOf(flat);
    if (hit >= 0) {
      start = c.map[hit];
      const lastIdx = Math.min(hit + flat.length - 1, c.map.length - 1);
      end = c.map[lastIdx] + 1;
    }
  }
  if (start < 0) { toast('编辑器里找不到这条语句（可能已修改）', 'bad'); return; }

  ta.focus();
  ta.setSelectionRange(start, end);
  const lh = parseFloat(getComputedStyle(ta).lineHeight) || 23;
  const line = ta.value.slice(0, start).split('\n').length;
  ta.scrollTop = Math.max(0, (line - 3) * lh);
  if (typeof syncScroll === 'function') syncScroll();
  flashEditorRange(start, end);
  toast('已跳到第 ' + line + ' 行', 'ok');
}

function jumpToFirst(level) {
  const rows = [...document.querySelectorAll('#res .chk')];
  const target = rows.find(r => r.getAttribute('data-level') === level);
  if (!target) { toast('结果里没有这一类的明细', 'bad'); return; }
  const blk0 = target.closest('.sblock');
  if (blk0 && !blk0.classList.contains('open')) {
    blk0.classList.add('open');
    const b0 = blk0.querySelector('.sbtn');
    if (b0) b0.textContent = '收起';
  }
  flashRow(target);
  const st = Number(target.getAttribute('data-jump'));
  if (!isNaN(st) && st >= 0) jumpToStmt(st);
}

function toggleResBig() {
  const r = $('res');
  r.classList.toggle('big');
  const on = r.classList.contains('big');
  toast(on ? '结果区已放大' : '结果区已还原', 'ok');
}

// 把原文里的字符区间映射到高亮层 DOM 并画一条可见色带
function domPos(root, offset) {
  let acc = 0;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = w.nextNode())) {
    const len = n.nodeValue.length;
    if (acc + len >= offset) return { node: n, off: Math.max(0, offset - acc) };
    acc += len;
  }
  return null;
}

function flashEditorRange(start, end) {
  const hl = $('hl');
  if (!hl || start == null || start < 0) return;
  const a = domPos(hl, start), b = domPos(hl, Math.max(start, end || start));
  if (!a || !b) return;
  let rect = null;
  try {
    const r = document.createRange();
    r.setStart(a.node, a.off);
    r.setEnd(b.node, b.off);
    rect = r.getClientRects()[0] || r.getBoundingClientRect();
  } catch (e) { return; }
  if (!rect || !rect.height) return;
  const base = hl.getBoundingClientRect();
  const band = document.createElement('div');
  band.className = 'flashband';
  band.style.top = (rect.top - base.top + hl.scrollTop) + 'px';
  band.style.height = rect.height + 'px';
  hl.appendChild(band);
  setTimeout(() => band.remove(), 1600);
}

function detailHTML(c) {
  const txt = c.detail || '';
  if ((c.title || '').indexOf('同一张表') >= 0) {
    return txt.split('\n').map(line => {
      const m = line.match(/^第\s*(\d+)\s*条/);
      if (m) {
        const i = Number(m[1]) - 1;
        return `<div class="jline" onclick="event.stopPropagation();jumpToStmt(${i})">${esc(line)}<span class="jgo">跳到第 ${m[1]} 条 ↗</span></div>`;
      }
      return `<div class="jline plain">${esc(line)}</div>`;
    }).join('');
  }
  return `<span class="chk-d" title="${esc(txt)}">${esc(txt)}</span>`;
}

function clickCheck(el, stmt) {
  flashRow(el);              // 先在结果区定位并高亮这条明细
  if (stmt != null && stmt >= 0) jumpToStmt(stmt);
}

function flashRow(sel) {
  const el = typeof sel === 'string' ? document.querySelector(sel) : sel;
  if (!el) return;
  el.scrollIntoView({ block: 'nearest' });
  el.classList.remove('hit');
  void el.offsetWidth;
  el.classList.add('hit');
  setTimeout(() => el.classList.remove('hit'), 1600);
}

function stmtSummary(cs) {
  // 每条检查都列出来：✓通过 / ⚠提醒 / ✕错误
  const mark = l => l === 'error' ? '✕ ' : l === 'warn' ? '⚠ ' : '✓ ';
  const label = c => {
    const t = c.title || '';
    if (t.indexOf('预计影响行数') >= 0) return c.detail || t;
    if (t.indexOf('被更新表') >= 0 || t.indexOf('目标表') >= 0 || t.indexOf('被删除表') >= 0) {
      return t + ' ' + String(c.detail || '').replace(/[（(].*$/, '').trim();
    }
    if (t.indexOf('数据来源表') >= 0) return t + ' ' + String(c.detail || '');
    return t;
  };
  const bits = cs.slice(0, 6).map(c => mark(c.level) + label(c));
  if (cs.length > 6) bits.push('…');
  return bits.join(' · ') || '通过';
}

function blockHTML(stmt, level, title, summary, body) {
  return `<div class="sblock" data-stmt="${stmt}">
    <div class="shead" tabindex="0" role="button" onkeydown="sheadKey(event,this)">
      <span class="sdot ${level}"></span>
      <span class="stitle">${title}</span>
      <span class="ssum">${esc(summary || '')}</span>
      <span class="sp"></span>
      <button class="sm sbtn" onclick="toggleBlock(this,event)">展开</button>
    </div>
    <div class="sbody">${body}</div>
  </div>`;
}

function sheadKey(e, el) {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    toggleBlock(el.querySelector('.sbtn'), e);
  }
}

function toggleBlock(btn, ev) {
  if (ev) ev.stopPropagation();
  const blk = btn.closest('.sblock');
  if (!blk) return;
  const open = blk.classList.toggle('open');
  btn.textContent = open ? '收起' : '展开';
}

// 渲染失败时给出可见提示，而不是留一块空白
function safeRender(fn) {
  hideBusy();
  try {
    fn();
  } catch (e) {
    const res = $('res');
    if (res) {
      res.innerHTML = `<div class="rhead"><span class="badge bad">渲染失败</span></div>`
        + `<div class="errbox">${esc((e && e.message) || String(e))}</div>`;
    }
  }
}

// 检查升级源里的 version.json，有新版本就显示下载入口
const REPO_URL = 'https://github.com/wcbspp/medupdate-tool';
let UPDATE_INFO = null;
let UPDATE_BASE = '';
let LISTEN_MODE = 'local';
let APP_VERSION = '';

async function checkUpdate(fresh) {
  try {
    const r = await api('/api/update/check' + (fresh ? '?fresh=1' : ''));
    if (!r) return;
    if (r.base) UPDATE_BASE = r.base;
    if (!r.enabled || !r.hasUpdate) { UPDATE_INFO = null; return; }
    UPDATE_INFO = r;
    const dot = $('updDot');
    if (dot) dot.style.display = 'inline-block';
    const vt = $('verTag');
    if (vt) { vt.classList.add('has-upd'); vt.title = '有新版本 ' + r.latest + '，点击查看'; }
  } catch (e) {}
}

// 点版本号：显示版本信息、更新说明（如有）和仓库地址
async function openUpdate() {
  // 每次点开都重新取一次，避免显示缓存里的旧版本
  try { await checkUpdate(true); } catch (e) {}

}

async function openSettings() {
  let on = PREFLIGHT_ON, up = '', lm = 'local';
  try { const r = await api('/api/settings'); on = !!r.preflight; up = r.updateUrl || ''; lm = r.listenMode || 'local'; } catch (e) {}
  const dlg = $('dlg');
  dlg.className = 'dlg';
  dlg.innerHTML = `<h3>设置</h3>
    <label style="display:flex;align-items:flex-start;gap:9px;margin:14px 0 0;font-size:13px;color:var(--fg);line-height:1.6">
      <input id="setPf" type="checkbox" ${on ? 'checked' : ''} style="width:auto;margin-top:3px">
      <span>新建文件夹时默认开启「执行前数据预检」</span>
    </label>
    <div style="font-size:12px;color:#a9b8cc;line-height:1.9;margin-top:6px">
      已有文件夹的设置不受影响，请点文件夹上的 ⚙ 单独设置。
    </div>
    <label>升级源地址（可留空）</label>
    <input id="setUp" value="${esc(up)}" placeholder="https://example.com/medupdate-xxxx/">
    <div style="font-size:12px;color:#a9b8cc;line-height:1.9;margin-top:6px">
      填了之后启动时会读该地址下的 version.json 检查新版本；只读取清单，不改数据。
    </div>
    <label>访问范围</label>
    <div class="radioRow">
      <label class="radioOpt"><input type="radio" name="setListen" value="local" ${lm !== 'all' ? 'checked' : ''}>
        <span>仅本机</span><em>推荐，只有这台电脑能打开</em></label>
      <label class="radioOpt"><input type="radio" name="setListen" value="all" ${lm === 'all' ? 'checked' : ''}>
        <span>允许局域网访问</span><em>同网段任何人都能打开并执行脚本</em></label>
    </div>
    <div class="hintBox">本工具没有登录验证。开启局域网访问前，请确认网络环境可信。修改后程序会自动重启（约 2 秒）。</div>
    <div class="repoBox"><span class="repoLbl">仓库</span>
      <a href="${REPO_URL}" target="_blank" rel="noopener">${esc(REPO_URL.replace('https://github.com/', ''))} ↗</a></div>
    <div class="foot">
      <button id="cExit" class="danger">退出程序</button>
      <span class="l"></span>
      <button id="cCancel">关闭</button>
      <button class="primary" id="cOk">保存</button></div>`;
  $('mask').classList.add('on');

  const close = () => { $('mask').classList.remove('on'); };
  $('cCancel').onclick = () => close();
  $('cOk').onclick = async () => {
    const val = $('setPf').checked;
    const url = ($('setUp') ? $('setUp').value : '').trim();
    const pick = document.querySelector('input[name="setListen"]:checked');
    const mode = pick ? pick.value : 'local';
    try {
      const r = await post('/api/settings', { preflight: val, updateUrl: url, listenMode: mode });
      PREFLIGHT_ON = val;
      if (r && r.needRestart) {
        close();
        showExitNote('正在重启…', '监听范围已修改，程序会在 2 秒后重新启动，页面会自动刷新。', false);
        setTimeout(() => location.reload(), 3200);
      } else {
        toast('已保存', 'ok');
        close();
      }
    } catch (e) { toast(e.message, 'bad'); }
  };

  // 退出程序：二次确认
  const ex = $('cExit');
  if (ex) ex.onclick = async () => {
    if (!confirm('退出后当前页面会断开，需要重新启动程序才能继续使用。确定退出？')) return;
    try { await post('/api/shutdown', {}); } catch (e) {}
    close();
    showExitNote('程序已退出', '可以关闭这个页面了。下次使用时重新打开 medupdate 即可。', true);
  };
  dlg.onkeydown = e => { if (e.key === 'Escape') close(); };
}

/* ================= 日志 ================= */
async function openLogs() {
  $('logdlg').innerHTML = `<h3>执行日志 <span class="sp"></span>
      <button class="sm" onclick="loadLogs()">刷新</button>
      <button class="sm danger" onclick="clearLogs()">清空</button>
      <button class="sm" onclick="closeLogs()">关闭</button></h3>
    <div style="display:flex;gap:6px;margin-bottom:8px" id="logbtns">
      ${['', 'true', 'false'].map(v => `<button class="sm" data-f="ok" data-v="${v}" onclick="setFilter('ok','${v}')">${v === '' ? '全部' : v === 'true' ? '仅成功' : '仅失败'}</button>`).join('')}
      <span style="width:10px"></span>
      ${['', 'true', 'false'].map(v => `<button class="sm" data-f="dry" data-v="${v}" onclick="setFilter('dry','${v}')">${v === '' ? '全部模式' : v === 'true' ? '仅预演' : '仅执行'}</button>`).join('')}
    </div>
    <div class="lwrap" id="lwrap"><div style="padding:14px;color:#65707f;font-size:12px">加载中…</div></div>`;
  $('logmask').classList.add('on');
  await loadLogs();
  syncFilterButtons();
}
function closeLogs() { $('logmask').classList.remove('on'); }
function setFilter(k, v) { logFilter[k] = v; syncFilterButtons(); loadLogs(); }
function syncFilterButtons() {
  document.querySelectorAll('#logbtns button').forEach(b => {
    const on = logFilter[b.dataset.f] === b.dataset.v;
    b.style.borderColor = on ? 'var(--acc)' : '';
    b.style.color = on ? 'var(--acc)' : '';
  });
}
async function loadLogs() {
  const qs = new URLSearchParams({ limit: '200' });
  if (logFilter.ok) qs.set('ok', logFilter.ok);
  if (logFilter.dry) qs.set('dry', logFilter.dry);
  try {
    const r = await api('/api/logs?' + qs.toString());
    LOGS = r.logs || [];
    renderLogs();
  } catch (e) {
    $('lwrap').innerHTML = `<div style="padding:14px;color:#ff9a9a">${esc(e.message)}</div>`;
  }
}
function renderLogs() {
  if (!LOGS.length) { $('lwrap').innerHTML = `<div style="padding:14px;color:#65707f;font-size:12px">没有记录</div>`; return; }
  $('lwrap').innerHTML = LOGS.map((l, i) => {
    const t = new Date(l.ts);
    const time = t.toLocaleString('zh-CN', { hour12: false });
    const mode = l.type === 'preflight' ? '预检' : (l.dryRun ? '预演' : '执行');
    return `<div class="lrow" onclick="toggleLog(${i})">
        <span class="t">${time}</span>
        <span class="s" title="${esc(l.script || '')}">${esc(l.script || '-')}</span>
        <span class="chip">${mode}</span>
        <span class="badge ${l.ok ? 'ok' : 'bad'}">${l.ok ? 'OK' : 'FAIL'}</span>
        <span class="m">${l.ms || 0}ms · ${l.stmts || 0}条 · ${l.affected || 0}行</span>
        ${logVersion(l) ? `<span class="chip">${esc(logVersion(l))}</span>` : ''}
      </div>
      <div class="ldet" id="ld${i}" style="display:none">${esc(logDetail(l))}</div>`;
  }).join('');
}
function logVersion(l) {
  if (!Array.isArray(l.versions) || !l.versions.length) return '';
  const v = l.versions[0] || {};
  const vals = (v.ok || []).concat(v.other || []);
  return vals.length ? vals.join('/') : '';
}

function logDetail(l) {
  const lines = [];
  lines.push(`数据源：${l.ds || '-'}    库：${l.database || '-'}`);
  lines.push(`时间：${l.ts}    模式：${l.dryRun ? '预演' : '执行'}    耗时：${l.ms}ms    语句：${l.stmts} 条`);
  lines.push(`影响行数：${l.affected || 0}    数据版本：${logVersion(l) || '-'}`);
  if (l.type === 'preflight') lines.push(`类型：预检（只读）    错误 ${l.errCount || 0} 项    提醒 ${l.warnCount || 0} 项`);
  if (l.failedAt != null && l.failedAt >= 0) lines.push(`失败位置：第 ${l.failedAt + 1} 条`);
  if (l.error) lines.push(`错误：${l.error}`);
  if (Array.isArray(l.previews) && l.previews.length) {
    lines.push('语句：');
    l.previews.forEach((p, i) => lines.push(`  ${i + 1}. ${p}`));
  }
  return lines.join('\n');
}
function toggleLog(i) {
  const el = $('ld' + i);
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}
async function clearLogs() {
  if (!confirm('清空所有执行日志？')) return;
  await del('/api/logs');
  LOGS = []; renderLogs(); toast('已清空', 'ok');
}

/* ================= 结果区分隔条 ================= */
function initResizer() {
  let dragging = false;
  $('rz').addEventListener('mousedown', e => {
    e.preventDefault(); dragging = true; document.body.style.cursor = 'row-resize';
  });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const h = window.innerHeight - e.clientY - 14;
    $('res').style.height = Math.max(70, Math.min(window.innerHeight * 0.72, h)) + 'px';
  });
  window.addEventListener('mouseup', () => { dragging = false; document.body.style.cursor = ''; });
}

/* ================= 悬浮提示 ================= */
(function initTip() {
  const tip = document.createElement('div');
  tip.id = 'tip';
  document.body.appendChild(tip);
  document.addEventListener('mouseover', e => {
    const el = e.target.closest('[data-tip]');
    if (!el) { tip.classList.remove('on'); return; }
    tip.textContent = el.dataset.tip;
    const r = el.getBoundingClientRect();
    tip.style.left = Math.max(70, Math.min(window.innerWidth - 70, r.left + r.width / 2)) + 'px';
    tip.style.top = (r.top - 5) + 'px';
    tip.classList.add('on');
  });
  document.addEventListener('mouseout', e => {
    if (e.target.closest('[data-tip]')) tip.classList.remove('on');
  });
  document.addEventListener('scroll', () => tip.classList.remove('on'), true);
})();

/* ================= 启动 ================= */
(async function boot() {
  initResizer();
  paint();
  try {
    try { const st0 = await api('/api/settings'); PREFLIGHT_ON = !!st0.preflight; } catch (e) {}
    await loadTree();
    const first = Object.keys(IDX.s)[0];
    if (first) await selectScript(first);
    try { if (localStorage.getItem('niuma_paused') === '1') toggleNiuma(); } catch (e) {}
    try { localStorage.removeItem('ui_zoom'); document.documentElement.style.removeProperty('--ui-zoom'); document.body.style.zoom = ''; } catch (e) {}
    let BOOTED_BUILD = '';
    const vt = $('verTag');
    if (vt) vt.onclick = () => openUpdate();
    const gb = $('ghBtn');
    if (gb) gb.onclick = () => openUpdate();
    setTimeout(() => { try { checkUpdate(); } catch (e) {} }, 1200);
    // 每 20 秒确认服务仍在响应，绿点据此闪烁/变红
    setInterval(() => {
      fetch('/api/health', { cache: 'no-store' }).then(r => r.json()).then(h => {
        if (h && h.listenMode) LISTEN_MODE = h.listenMode;
        updateHealth();
      }).catch(() => {
        const el = document.querySelector('#who .hb');
        if (el) { el.className = 'hb bad'; }
      });
    }, 20000);
    fetch('/api/health').then(r => r.json()).then(h => {
      if (!h || !h.build) return;
      BOOTED_BUILD = h.build;
      const vtag = $('verTag');
      if (h.version) APP_VERSION = h.version;
      if (h.listenMode) LISTEN_MODE = h.listenMode;
      updateHealth();
      const vtxt = $('verText');
      if (vtxt && h.version) {
        vtxt.textContent = 'v' + h.version + ' · 创意 by 吴美丽';
        vtag.style.visibility = 'visible';
      }
    }).catch(() => {
      const vtag2 = $('verTag'), vtxt2 = $('verText');
      if (vtxt2 && !vtxt2.textContent) { vtxt2.textContent = 'v? · 创意 by 吴美丽'; }
      if (vtag2) vtag2.style.visibility = 'visible';
    });

  } catch (e) { toast('初始化失败：' + e.message, 'bad'); }
})();

$('sql').addEventListener('input', () => { dirty = true; paint(); $('btnUnfmt').style.display = 'none'; fmtPrev = null; });
$('sql').addEventListener('scroll', syncScroll);
$('sql').addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); preflight(); }
  if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key === 'Enter') { e.preventDefault(); run(false); }
  if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); saveSql(); }
  if (e.key === 'Tab') {
    e.preventDefault();
    const t = e.target, s = t.selectionStart;
    t.value = t.value.slice(0, s) + '  ' + t.value.slice(t.selectionEnd);
    t.selectionStart = t.selectionEnd = s + 2;
    dirty = true; paint();
  }
});
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('resize', () => { $('hl').scrollTop = $('sql').scrollTop; });
</script>
